    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetBoxVirtualMachine is one virtualization.VirtualMachine in NetBox.

          Namespaced like every kind in v1alpha1 (docs/decisions/0002-crd-scoping.md).

          `PRIMARY-IP` reads `.status.deferredPending` rather than the spec, and that is
          deliberate: the question a VM's primary address raises is not "what did you ask for" but
          "has it been written yet", and the spec cannot answer it. An empty column means nothing is
          outstanding.

          There is no `spec.macAddress` and no `spec.primaryMACAddressRef`. NetBox 4.2 moved the MAC
          to its own model, `dcim.MACAddress` with a generic FK, and `virtualization.VMInterface`
          carries only `mac_addresses GenericRelation` (docs/netbox-schema.md ->
          virtualization.VMInterface, dcim.BaseInterface). NBO-048 lands the Kind; until then the
          field is absent rather than accepted and dropped.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetBoxVirtualMachineSpec describes one virtualization.VirtualMachine.

              The kind with the most intricate identity in the catalogue so far: four UniqueConstraints,
              three of them conditional, all four over `Lower('name')` (docs/netbox-schema.md ->
              virtualization.VirtualMachine, meta.constraints). See
              internal/registry/virtualization_virtualmachine.go for the ordered candidate list they
              become, and docs/reference/netboxvirtualmachine.md for the reading of each one.

              **`disk` is not a field the operator has to defend.** NBO-029's spec carried a hypothesis
              that NetBox recomputes `disk` from a VM's virtual disks, which would make `spec.disk`
              alongside a NetBoxVirtualDisk a PATCH loop and therefore something the operator must
              refuse. The source says otherwise: `VirtualMachine.clean()` sets `disk` from the aggregate
              only when it is `None`, and raises `ValidationError` when it is set and disagrees
              (`netbox/virtualization/models/virtualmachines.py` lines 330-341, NetBox 4.6.8). So the
              server rejects the contradiction loudly, the operator reports `Ready=False,
              Reason=Invalid` carrying NetBox's own message, and there is no drift loop to guard
              against. No guard clause ships, because there is nothing left for it to prevent.

              `deletionPolicy` keeps the envelope's `Delete` default, which is right here and is not on
              the IPAM kinds: a deleted VM record is re-creatable from the manifest that described it,
              and a prefix's history is not (docs/reference/netboxprefix.md).

              **The two `primary` rules are enforced twice on purpose.** `primary_ip4` has exactly one
              source: either `primaryIP4Ref` or one inline address marked `primary`, never both and never
              two of the latter. The rules below count the sources and refuse a second at admission; the
              controller counts them again and reports `Conflict` writing nothing
              (virtualization_virtualmachine_inline.go, DerivedRefs). Defence in depth because the CEL
              half is a nested list comprehension, which the API server costs at the product of both
              lists' maxima -- a rule that grows out of its cost budget stops being installed, and a rule
              that silently is not evaluated is worse than no rule at all.
            properties:
              clusterRef:
                description: |-
                  ClusterRef is the cluster the VM runs on (docs/netbox-schema.md ->
                  virtualization.VirtualMachine, `cluster ForeignKey -> virtualization.Cluster
                  on_delete=PROTECT`).

                  Nullable in the database and part of the identity when set. It is also this kind's
                  containment parent: deleting the NetBoxCluster takes its VMs with it, and their
                  interfaces and disks after them (docs/decisions/0003-ownership-and-references.md
                  rule 4).

                  NetBoxCluster lands with NBO-028. Until it does, `clusterRef: {name: ...}` reports
                  `RefsResolved=False, Reason=RefKindUnavailable` and nothing is written -- the
                  manifest is right and the operator is short a Kind.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              comments:
                description: |-
                  Comments is the VM's long-form notes field. Also inherited from PrimaryModel, and a
                  TextField rather than a CharField: it has no max_length, so there is no MaxLength
                  marker to derive.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                type: string
              customFields:
                additionalProperties:
                  nullable: true
                  type: string
                description: |-
                  CustomFields are NetBox custom-field values to write, keyed by NetBox custom-field
                  name. Every key must already exist as an `extras.CustomField` covering this object
                  type -- NetBox rejects the whole payload otherwise.

                  The map is deliberately **not** exhaustive: only the keys named here are written and
                  compared, and every other custom field on the NetBox object is left exactly as it is.
                  NetBox merges a partial `custom_fields` PATCH and returns every custom field defined
                  for the object type, including ones this operator knows nothing about, so treating
                  the map as the whole container would null out every custom field another writer on
                  that NetBox owns, on every reconcile. Omitting the map, or setting it to `{}`,
                  therefore means "manage nothing" rather than "clear everything".

                  `null` and `""` are different intents and both are expressible:

                    customFields:
                      rack_position: ""      # set this custom field to the empty string
                      audit_ticket: null     # remove this custom field's value

                  `null` is sent to NetBox as JSON null, which is the value NetBox stores for a custom
                  field that has no value and the value it returns on read -- indistinguishable from a
                  field never set, which is what "removed" means here. `""` stores and returns the
                  empty string. Removing the key from the manifest entirely is the third state: it
                  hands the field back and NetBox keeps whatever it holds
                  (docs/concepts/field-ownership.md).

                  Set on a kind whose NetBox model carries no `custom_fields` column -- extras.Tag is
                  one, so a NetBoxTag is the case -- and the object reports Ready=False,
                  Reason=Invalid. Refused rather than dropped: a discarded value would leave the
                  object claiming to be synced while NetBox never received it.
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy is what happens to the NetBox object when this CR is deleted.

                  Read fresh on every pass rather than latched when deletion starts, so switching it
                  to Retain on an object whose delete NetBox keeps refusing is a way out of that
                  state (docs/concepts/deletion.md).

                  Left unset it is Delete for most kinds and Retain for the IPAM ones, where deleting
                  the NetBox object destroys state rather than configuration -- an address freed for
                  reallocation, a range whose ownership record is gone (decision #176). The default is
                  therefore *not* a CRD marker: this field is declared once for every kind, so a marker
                  here could only give them all the same answer. Each kind declares its own on its
                  Descriptor and docs/concepts/deletion.md lists them.
                enum:
                - Delete
                - Retain
                type: string
              description:
                description: |-
                  Description is free text shown next to the VM. Declared on PrimaryModel rather than
                  on virtualization.VirtualMachine (docs/netbox-schema.md ->
                  virtualization.VirtualMachine, `description (PrimaryModel) CharField len=200`); an
                  inherited column is as writable as a declared one.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 200
                type: string
              deviceRef:
                description: |-
                  DeviceRef pins the VM to the host device it runs on (docs/netbox-schema.md ->
                  virtualization.VirtualMachine, `device ForeignKey -> dcim.Device on_delete=PROTECT`).

                  Part of the identity when there is no cluster: two of the four unique constraints are
                  over `(Lower(name), device, ...)` and both are conditional on `cluster IS NULL AND
                  device IS NOT NULL`, so a device-hosted VM has a different natural key from a
                  cluster-hosted one rather than the same key with a filter missing.

                  NetBox refuses a device assignment that contradicts the device's own cluster -- a
                  device that belongs to a cluster requires that cluster named explicitly, and a device
                  in a different cluster is rejected (`clean()` lines 313-327). Both need the device's
                  row, so both stay server-side.

                  NetBoxDevice lands with NBO-030. `deviceRef: {id: 42}` works today, because an id
                  needs the target's endpoint and not its CR; `deviceRef: {name: ...}` reports
                  RefKindUnavailable until the Kind ships.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              disk:
                description: |-
                  Disk is the VM's total disk in megabytes (docs/netbox-schema.md ->
                  virtualization.VirtualMachine, `disk PositiveIntegerField`) -- MB or MiB per the
                  instance's `DISK_BASE_UNIT`, as with `memory`. Not gigabytes, which NBO-029's spec
                  table has; NetBox's own form derives the label from the same setting as RAM's.

                  Set it or use NetBoxVirtualDisk, never both with different totals. NetBox fills
                  `disk` from the aggregate of a VM's virtual disks when it is null, and **rejects** a
                  value that disagrees with that aggregate
                  (`netbox/virtualization/models/virtualmachines.py` lines 330-341, NetBox 4.6.8) --
                  so the contradiction is a 400 reported as `Ready=False, Reason=Invalid` naming both
                  numbers, not a PATCH loop, and not something the operator has to guard.

                  A pointer for the same reason `memory` is one.
                format: int32
                maximum: 2147483647
                minimum: 0
                type: integer
              disks:
                description: |-
                  Disks are the VM's virtual disks, each materialised as its own NetBoxVirtualDisk CR
                  owned by this VM. A map list keyed by name and bounded at 32, for the reasons
                  `interfaces` is.

                  NetBox fills this VM's `disk` column from the aggregate of these when `spec.disk` is
                  unset, and **rejects** a `spec.disk` that disagrees with the aggregate
                  (`netbox/virtualization/models/virtualmachines.py` lines 330-341, NetBox 4.6.8) -- a
                  loud 400 reported as `Ready=False, Reason=Invalid` naming both numbers, not a PATCH
                  loop. Setting both consistently is legal, so nothing here forbids the combination.

                  Omit it and this VM materialises no disks; `[]` prunes the ones a previous revision
                  declared.
                items:
                  description: |-
                    InlineVirtualDisk is one entry of NetBoxVirtualMachine.spec.disks: a NetBoxVirtualDisk the
                    VM materialises and owns.

                    Note what this does *not* do to `spec.disk`. NetBox fills the VM's `disk` column from the
                    aggregate of its virtual disks when it is null and **rejects** a value that disagrees with
                    that aggregate (`netbox/virtualization/models/virtualmachines.py` lines 330-341, NetBox
                    4.6.8), so `spec.disk` beside these is a loud 400 reported as `Ready=False, Reason=Invalid`
                    naming both numbers -- not a PATCH loop, and not something the operator has to guard against
                    by refusing the combination. Setting both consistently works and is legal, which is why
                    there is no rule here forbidding it.
                  properties:
                    description:
                      description: |-
                        Description is free text shown next to the disk. Two states, not three -- see the note on
                        InlineVMInterface.
                      maxLength: 200
                      type: string
                    name:
                      description: Name is the disk's name, and **this entry's key**.
                        Case-sensitive, like the interface's.
                      maxLength: 64
                      minLength: 1
                      type: string
                    size:
                      description: |-
                        Size is the disk's size, in whatever unit the NetBox instance's `DISK_BASE_UNIT` names.
                        Required, because `virtualization.VirtualDisk.size` is: a disk of no stated size is not a
                        thing to let through admission, and `size: 0` is legal and explicit.
                      format: int32
                      maximum: 2147483647
                      minimum: 0
                      type: integer
                  required:
                  - name
                  - size
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              endpointRef:
                description: |-
                  EndpointRef names the NetBoxEndpoint to write through, in this object's own
                  namespace. Required: there is no cluster-wide default endpoint, so an omitted
                  reference cannot be resolved into one.

                  **Immutable.** Pointing a CR at a different NetBox is not a mutation of the object, it
                  is a different object: the natural key is looked up in whichever NetBox this names, so
                  an edit here would leave the old NetBox holding an object nothing manages and would
                  adopt or create a second one in the new one, with the CR's status.id switching between
                  the two. Edit it by deleting the CR -- which lets spec.deletionPolicy do what it says
                  about the object being left behind -- and re-applying it.

                  A CEL transition rule and not the admission webhook, which is the whole layer-1 test:
                  it needs `self` and `oldSelf` and no second object, so the API server enforces it
                  unconditionally and it survives every webhook in the cluster being down (NBO-044).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: endpointRef is immutable; pointing a CR at a different
                    NetBox is a different object, so delete this one and re-apply
                    it
                  rule: self == oldSelf
              interfaces:
                description: |-
                  Interfaces are the VM's network interfaces, each materialised as its own
                  NetBoxVMInterface CR owned by this VM -- and each of their `addresses` as a
                  NetBoxIPAddress or a NetBoxIPAddressClaim
                  (docs/concepts/inline-children.md, docs/decisions/0003-ownership-and-references.md rule
                  5). Nothing is hidden: the children appear in `kubectl get`, carry their own conditions
                  and write their own NetBox objects, and `kubectl delete` on this VM takes them with it.

                  A **map list keyed by name**, which is what makes two entries named `eth0` a rejection
                  by the API server rather than a Conflict discovered at reconcile time: the key is what
                  makes the derived child name and the owned-by path unique, so a duplicate is not a
                  state the operator can be in. It also gives server-side apply per-entry ownership, so
                  two writers editing different interfaces of one VM do not fight.

                  Bounded at 32. Unlike a to-many reference's 256, this is a real-world maximum rather
                  than a convention: VMware caps a VM at 10 vNICs and a virtio guest at ~31 slots, so 32
                  is past every hypervisor's own limit -- and it is also a bound the *nested* lists below
                  are multiplied by when the API server costs their CEL rules
                  (docs/concepts/references.md, "A list needs a bound").

                  Omit it and this VM materialises no interfaces. `[]` is the same statement -- the sugar
                  declares no children -- and prunes the ones a previous revision declared; it does not
                  touch a hand-written NetBoxVMInterface that points at this VM, which is never
                  materialised, never pruned and never appears in `status.children`.
                items:
                  description: |-
                    InlineVMInterface is one entry of NetBoxVirtualMachine.spec.interfaces: a NetBoxVMInterface
                    the VM materialises and owns.

                    `virtualMachineRef` is absent, and that is the rule rather than an omission: the
                    materialiser sets it from the parent, so a field the user cannot meaningfully set does not
                    exist here instead of existing and being ignored.

                    **An inline field has two states where a longhand one has three, and it follows from
                    `omitempty` rather than from a decision here.** The child is written with server-side apply,
                    `omitempty` drops `description: ""` from the request, no manager claims the field, and the
                    child's own pass therefore reads it as *absent* -- "leave NetBox alone" rather than "clear"
                    (docs/concepts/field-ownership.md). An inline entry can set a value and leave one alone;
                    clearing one is a longhand NetBoxVMInterface, where the field is the user's own and the
                    distinction survives. The same is true of every optional string on the two entry types below.
                  properties:
                    addresses:
                      description: |-
                        Addresses are the IP addresses on this interface, each materialised as its own CR and
                        assigned to the interface this entry declares.

                        Not a map list, unlike `interfaces` and `disks`: an entry's key is its `address` when it
                        states one and its pool when it says `claimFrom`, so there is no single property the API
                        server could key the list on. Two entries deriving one key are caught by the
                        materialiser instead, which reports `ChildrenReady=False, Reason=Conflict` naming both
                        and writes nothing at all (docs/concepts/inline-children.md).

                        Bounded at 16 for the nesting reason `taggedVLANs` is bounded at 32. Sixteen addresses
                        on one virtual interface is already unusual; the seventeenth is written as its own
                        NetBoxIPAddress with `assignedObject.vmInterfaceRef` naming the materialised interface.
                      items:
                        description: |-
                          InlineVMAddress is one entry of NetBoxVirtualMachine.spec.interfaces[].addresses: either an
                          address the manifest states, or one allocated out of a pool.

                          `assignedObject` is absent for the reason `virtualMachineRef` is absent from the interface
                          entry -- the materialiser sets it, to the interface child this address is nested under.

                          `tenantRef` is absent for a different reason, and it is worth naming: NetBoxIPAddress has no
                          `tenantRef` either. `ipam.IPAddress.tenant` waits on NBO-021, and an inline field the child
                          CR could not carry would be accepted and silently dropped.

                          **`allowDuplicate` is absent, and this one is a safety property rather than a scope
                          decision.** The flag makes the provenance stamp part of an address's identity; a stamped
                          child that loses `status.id` -- a status write lost to a restart, a restore -- then finds no
                          match it can claim and **creates a second address**
                          (internal/reconciler/duplicate.go, https://github.com/ricardomolendijk/netbox-operator/issues/167).
                          A materialised child is exactly the object most likely to be re-created from an unchanged
                          manifest, so the field it would be dangerous on is the field it does not have. An address
                          that legitimately exists twice -- anycast, a VRRP virtual address -- is written as its own
                          NetBoxIPAddress, where a human has said so deliberately.
                        properties:
                          address:
                            description: |-
                              Address is the address and its mask, `10.20.0.10/24` or `2001:db8::1/64`, and **this
                              entry's key including the mask**: `/24` and `/25` of one host are two NetBox objects and
                              two CRs, so they are two keys and two derived names.

                              The same loose pattern the longhand kind carries: it fixes the shape and the character
                              set and leaves the rest to NetBox, because a stricter regex here would be a second,
                              worse IP parser and every disagreement between the two would reject an address NetBox
                              accepts.
                            maxLength: 43
                            minLength: 4
                            pattern: ^[0-9A-Fa-f.:]+/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$
                            type: string
                          claimFrom:
                            description: |-
                              ClaimFrom allocates the address out of a pool instead of stating it, by materialising a
                              real NetBoxIPAddressClaim child.

                              Sugar over the claim kind rather than a second allocation path: the same Kind, the same
                              controller, the same advisory-locked POST, so there is exactly one place an address is
                              ever allocated (docs/decisions/0004-claims-first-allocation.md).
                            properties:
