    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetBoxDeviceType is one dcim.DeviceType in NetBox.

          Namespaced like every kind in v1alpha1 (docs/decisions/0002-crd-scoping.md), and the kind
          where that costs the most: `deviceTypeRef` and `manufacturerRef` from a team namespace into
          a shared catalogue namespace both need a NetBoxRefGrant, and without one every NetBoxDevice
          in every team namespace sits at RefsResolved=False, Reason=RefDenied. See
          docs/reference/netboxdevicetype.md, which opens with the grant.

          Two things this kind does not carry, both deliberate:

            - `front_image` and `rear_image` are ImageFields uploaded as multipart form data
              (docs/netbox-schema.md -> dcim.DeviceType). The REST API returns a URL and does not
              take one, so a spec field for either would be a field the operator sends and NetBox
              ignores -- and a CR spec is not a file transport.
            - `weight` and `weight_unit` come from WeightMixin and are NBO-027's declared
              out-of-scope columns. The digest does list them, so they are verified rather than
              guessed; they are absent because the ticket says so, and NBO-060 is the audit that
              picks them up.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetBoxDeviceTypeSpec describes one dcim.DeviceType.

              One make and model of device -- `dcim.Device.device_type` is a required foreign key
              (docs/netbox-schema.md -> dcim.Device), so no NetBoxDevice exists without one.

              The first kind whose identity is scoped by a **required** reference to another kind. Both
              of NetBox's constraints start at `manufacturer`, so an unresolved `manufacturerRef` leaves
              no applicable candidate at all and the object writes nothing -- the NetBoxLocation shape
              rather than the NetBoxPrefix one, where the object is created without the field.
            properties:
              airflow:
                description: |-
                  Airflow is the direction air moves through a device of this type.

                  Unset leaves NetBox's own value alone; `""` clears it. Cleared as `null` rather than
                  as an empty string, because NetBox's serializer returns `null` for an unset choice and
                  a payload of `""` would differ from the value read back on every pass -- see
                  registry.Field.EmptyIsNull.
                enum:
                - ""
                - front-to-rear
                - rear-to-front
                - left-to-right
                - right-to-left
                - side-to-rear
                - rear-to-side
                - bottom-to-top
                - top-to-bottom
                - passive
                - mixed
                type: string
              comments:
                description: |-
                  Comments is the device type's long-form notes field.

                  Also inherited from PrimaryModel, and a TextField rather than a CharField: it has no
                  max_length, so there is no MaxLength marker to derive.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                type: string
              customFields:
                additionalProperties:
                  nullable: true
                  type: string
                description: |-
                  CustomFields are NetBox custom-field values to write, keyed by NetBox custom-field
                  name. Every key must already exist as an `extras.CustomField` covering this object
                  type -- NetBox rejects the whole payload otherwise.

                  The map is deliberately **not** exhaustive: only the keys named here are written and
                  compared, and every other custom field on the NetBox object is left exactly as it is.
                  NetBox merges a partial `custom_fields` PATCH and returns every custom field defined
                  for the object type, including ones this operator knows nothing about, so treating
                  the map as the whole container would null out every custom field another writer on
                  that NetBox owns, on every reconcile. Omitting the map, or setting it to `{}`,
                  therefore means "manage nothing" rather than "clear everything".

                  `null` and `""` are different intents and both are expressible:

                    customFields:
                      rack_position: ""      # set this custom field to the empty string
                      audit_ticket: null     # remove this custom field's value

                  `null` is sent to NetBox as JSON null, which is the value NetBox stores for a custom
                  field that has no value and the value it returns on read -- indistinguishable from a
                  field never set, which is what "removed" means here. `""` stores and returns the
                  empty string. Removing the key from the manifest entirely is the third state: it
                  hands the field back and NetBox keeps whatever it holds
                  (docs/concepts/field-ownership.md).

                  Set on a kind whose NetBox model carries no `custom_fields` column -- extras.Tag is
                  one, so a NetBoxTag is the case -- and the object reports Ready=False,
                  Reason=Invalid. Refused rather than dropped: a discarded value would leave the
                  object claiming to be synced while NetBox never received it.
                type: object
              defaultPlatformRef:
                description: |-
                  DefaultPlatformRef is the platform a device of this type gets when it names none of
                  its own (docs/netbox-schema.md -> dcim.DeviceType, `default_platform ForeignKey ->
                  dcim.Platform on_delete=SET_NULL`).

                  Not part of the identity, so it is an ordinary reference: SET_NULL means deleting the
                  platform in NetBox clears this column rather than refusing, and the next reconcile
                  finds the drift and PATCHes it back.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy is what happens to the NetBox object when this CR is deleted.

                  Read fresh on every pass rather than latched when deletion starts, so switching it
                  to Retain on an object whose delete NetBox keeps refusing is a way out of that
                  state (docs/concepts/deletion.md).
                enum:
                - Delete
                - Retain
                type: string
              description:
                description: |-
                  Description is free text shown next to the device type.

                  Inherited from PrimaryModel (docs/netbox-schema.md -> dcim.DeviceType, `description
                  (PrimaryModel) CharField len=200`); an inherited column is as writable as a declared
                  one.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 200
                type: string
              endpointRef:
                description: |-
                  EndpointRef names the NetBoxEndpoint to write through, in this object's own
                  namespace. Required: there is no cluster-wide default endpoint, so an omitted
                  reference cannot be resolved into one.
                minLength: 1
                type: string
              excludeFromUtilization:
                description: |-
                  ExcludeFromUtilization leaves devices of this type out of rack utilisation arithmetic
                  (docs/netbox-schema.md -> dcim.DeviceType, `exclude_from_utilization BooleanField
                  def=False`).

                  A pointer, for the reason IsFullDepth gives.
                type: boolean
              isFullDepth:
                description: |-
                  IsFullDepth says a device of this type consumes both the front and the rear rack face
                  (docs/netbox-schema.md -> dcim.DeviceType, `is_full_depth BooleanField def=True`).

                  A pointer, and the reason is the column's default. A plain `bool` cannot tell "not
                  managed" from "managed as false", so adopting a hand-made half-depth type would
                  silently make it full-depth. Nil leaves NetBox's value alone; `false` writes false.
                type: boolean
              manufacturerRef:
                description: |-
                  ManufacturerRef is who makes this device type. Required, because NetBox's column is
                  (`manufacturer ForeignKey REQ -> dcim.Manufacturer on_delete=PROTECT`).

                  It is half of both natural keys -- `meta.constraints` is `(manufacturer, model)` and
                  `(manufacturer, slug)` -- so until it resolves the object reports
                  RefsResolved=False naming this field and makes no NetBox write at all, rather than
                  creating a manufacturer-less device type NetBox would refuse anyway.

                  PROTECT, so NetBox refuses to delete a manufacturer while any device type points at
                  it; that surfaces on the *manufacturer* as Deleting=False, Reason=Protected.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              model:
                description: |-
                  Model is the model name, as NetBox displays it
                  (docs/netbox-schema.md -> dcim.DeviceType, `model CharField REQ len=100`).

                  Unique per manufacturer, not globally: `..._unique_manufacturer_model` on
                  `(manufacturer, model)`. It is a candidate key and deliberately not the lookup key --
                  a kind gets one identity and `slug` is the stable one -- so a model rename that
                  collides comes back as NetBox's own 409.
                maxLength: 100
                minLength: 1
                type: string
              onConflict:
                default: Fail
                description: OnConflict is what to do when NetBox already holds a
                  matching object.
                enum:
                - Fail
                - Adopt
                - AdoptOnly
                type: string
              partNumber:
                description: |-
                  PartNumber is the vendor's discrete part number
                  (docs/netbox-schema.md -> dcim.DeviceType, `part_number CharField len=50`).

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 50
                type: string
              slug:
                description: |-
                  Slug is the device type's URL-safe identifier, and half of this kind's natural key.

                  Unique per manufacturer (docs/netbox-schema.md -> dcim.DeviceType, `meta.constraints`:
                  `..._unique_manufacturer_slug` on `(manufacturer, slug)`), which is what makes
                  `ubiquiti/ucg-ultra` and `mikrotik/ucg-ultra` two legitimate objects and two CRs in
                  two namespaces claiming `ubiquiti/ucg-ultra` one object and a Conflict.
                maxLength: 100
                minLength: 1
                pattern: ^[-a-zA-Z0-9_]+$
                type: string
              subdeviceRole:
                description: |-
                  SubdeviceRole is whether this type is a parent, a child, or neither.

                  Unset leaves NetBox's own value alone; `""` clears it, which is how NetBox spells
                  "neither" (the column is `blank=True`). Those are two different instructions and the
                  operator tells them apart from metadata.managedFields
                  (docs/concepts/field-ownership.md) -- the wording differs from the other clearable
                  fields here only because this one carries an enum.
                enum:
                - ""
                - parent
                - child
                type: string
              uHeight:
                default: "1.0"
                description: |-
                  UHeight is how many rack units a device of this type occupies, as a string.

                  A string and not a float64: NetBox stores it as `u_height DecimalField decimal(4,1)
                  def=1.0` and the API returns it padded, `"1.00"` for a spec that said `"1"`. An
                  OpenAPI `number` round-trips through IEEE-754 on the way in and out of the API server,
                  so a half-height `0.5` is not reliably what was written -- and the engine compares two
                  numeric strings numerically (internal/netbox/drift.go, scalarEqual), so `"0.5"` and
                  `"0.50"` produce no PATCH.

                  The pattern is the numeric-format rule and is read straight off `decimal(4,1)`: four
                  digits, one of them after the point, so 0 to 999.9 in steps of a tenth. No CEL rule on
                  top -- the column is not nullable and has no range validator, so a CEL bound would
                  duplicate the pattern rather than add a constraint.

                  Defaulted to NetBox's own default, so the operator manages the field from the first
                  reconcile: a defaulted field that never reaches a payload is a field the operator can
                  never correct.
                pattern: ^[0-9]{1,3}(\.[0-9])?$
                type: string
            required:
            - endpointRef
            - manufacturerRef
            - model
            - slug
            type: object
          status:
            description: |-
              NetBoxObjectStatus is the part of every object CR's status that the engine owns. It is
              the only thing the operator writes: the spec belongs to Git
              (docs/decisions/0005-gitops-coexistence.md).
            properties:
              adopted:
                description: Adopted reports that the engine took over an object it
                  did not create.
                type: boolean
              conditions:
                description: Conditions follow the standard Kubernetes vocabulary.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deferredPending:
                description: |-
                  DeferredPending are the CR spec fields the engine has declared deferred and has not
                  yet written to NetBox: a `primary_ip4` whose address does not exist yet, or one that
                  was stripped from the create and is waiting for its follow-up PATCH.

                  A status field rather than only a condition message. The intermediate state is
                  legitimate and can be long-lived -- a reference that never resolves stays here
                  forever, on purpose -- so "what is this object still waiting to write" has to be
                  answerable from `kubectl get -o yaml` and greppable across a namespace, which a
                  sentence inside a condition is not (docs/concepts/object-lifecycle.md).

                  Spec field names rather than NetBox column names, because it is the spelling the
                  user wrote and the one the RefsResolved message already uses.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              deletionAttempts:
                description: |-
                  DeletionAttempts counts the deletes NetBox refused because something still
                  references the object.

                  It is a status field rather than in-memory state because a controller has no memory
                  between passes: the exponential backoff on a protected delete has to be computed
                  from a count that survives a requeue, a leader election and a restart. Non-zero
                  only while a CR is terminating.
                format: int32
                type: integer
              id:
                description: |-
                  ID is the NetBox primary key. Zero until the object provably exists server-side --
                  a DryRun write is reported and never sent, so it leaves this empty rather than
                  inventing an id that nothing would ever match.
                format: int64
                type: integer
              lastAppliedHash:
                description: |-
                  LastAppliedHash is a digest of the last payload NetBox accepted. NetBox
                  canonicalises some values on write, so the request and the response legitimately
                  differ; this is the record of what was actually sent.
                type: string
              lastSyncTime:
                description: |-
                  LastSyncTime is when the engine last wrote to NetBox. Unset until it does, and
                  untouched by a reconcile that found nothing to do -- otherwise every resync would
                  bump the resourceVersion of every object in the cluster.
                format: date-time
                type: string
              naturalKey:
                additionalProperties:
                  type: string
                description: |-
                  NaturalKey is the lookup that actually located the object, filter by filter. The
                  first thing anyone needs when asking why an object was adopted, or was not.
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation this status refers to. Always set,
                  because `kubectl wait` lies without it.
                format: int64
                type: integer
              provenance:
                description: |-
                  Provenance is the stamp this object carries in NetBox: the tag and the custom fields
                  the engine wrote, as it wrote them.

                  Unset when the endpoint's spec.managedBy is unset, and unset for a kind whose NetBox
                  model carries neither `tags` nor `custom_fields` -- extras.Tag is one, so a
                  NetBoxTag is managed and unstamped by construction. That is the state NetBoxSweep
                  (NBO-046) reports and never deletes; see docs/operations/provenance.md.
                properties:
                  clusterID:
                    description: ClusterID is the cluster identifier written into
                      the cluster custom field.
                    type: string
                  customFields:
                    additionalProperties:
                      type: string
                    description: |-
                      CustomFields are the custom fields written, as NetBox names to the values sent.
                      Empty for a kind whose NetBox model has no `custom_fields` column.

                      These keys are also the only ones compared: NetBox merges a partial `custom_fields`
                      PATCH and returns every custom field defined for the object type, including ones the
                      operator knows nothing about, so it compares the keys it sets and leaves the rest
                      alone. An absent or empty map therefore still means "manage nothing" rather than
                      "clear everything"; removing one key's value is said with a `null` under
                      spec.customFields (docs/concepts/field-ownership.md, #196).
                    type: object
                  tag:
                    description: |-
                      Tag is the tag's slug, written by id. Empty for a kind whose NetBox model has no
                      `tags` column.
                    type: string
                type: object
              url:
                description: URL is the object's absolute NetBox URL, as returned
                  by the API.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
