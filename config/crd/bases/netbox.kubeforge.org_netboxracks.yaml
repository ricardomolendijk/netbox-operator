    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetBoxRack is one dcim.Rack in NetBox.

          Namespaced like every kind in v1alpha1 (docs/decisions/0002-crd-scoping.md).

          Absent deliberately:

            - **No containment parent at all**, the dcim.Device shape rather than the dcim.Location
              one: every foreign key on dcim.Rack is `PROTECT` except `location`, which is
              `SET_NULL`, so nothing on the server side disappears when a parent goes and there is
              nothing for an owner reference to mirror
              (docs/decisions/0003-ownership-and-references.md rule 4).
            - `device_count` and `powerfeed_count` are counters the serializer returns and the API
              refuses (hack/testdata/ir-4.6.8.json.gz -> dcim.Rack.write_path; docs/netbox-schema.md,
              preamble on every CounterCacheField). Declared read-only on the Descriptor.
            - `owner` is `ForeignKey -> users.Owner` and the `users` app has no Kind.
            - `_abs_max_weight` and `_abs_weight` are `_`-prefixed caches, absent from the write path.
            - `vlan_groups`, `contacts` and `images` are GenericRelations -- the far end of somebody
              else's foreign key. A rack is a legal `ContactAssignment` target through the union on
              NetBoxContactAssignment, and a legal `VLANGroup` scope through the one on
              NetBoxVLANGroup; both are written from the *other* object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "NetBoxRackSpec describes one dcim.Rack.\n\nThe rack itself,
              and the kind in NBO-051 whose identity NetBox does not enforce where
              you\nwould expect it to. Both of its `meta.constraints` are keyed on
              `location`:\n\n\tmodels.UniqueConstraint(fields=('location', 'name'),
              \       name='..._unique_location_name')\n\tmodels.UniqueConstraint(fields=('location',
              'facility_id'), name='..._unique_location_facility_id')\n\n(docs/netbox-schema.md
              -> dcim.Rack.meta.constraints.) `location` is optional and\n`on_delete=SET_NULL`,
              so a rack with no location has **no enforced key at all** and two\nidentically
              named location-less racks in one site are legal NetBox state. The natural
              key\ntherefore falls back to `(site, name)` with `location_id` pinned
              null -- a lookup\nconvention rather than a constraint -- and an ambiguous
              match is reported as `Conflict`\nrather than adopted. See internal/registry/dcim_rack.go
              and\ndocs/reference/netboxrack.md#natural-keys.\n\n**This kind is not
              scope-mixed.** NetBox 4.2 replaced `site` with a `(scope_type, scope_id)`\npair
              on ipam.Prefix, ipam.VLANGroup and virtualization.Cluster, and it is
              the trap\ndocs/reference/netboxcluster.md says it broke silently --
              but `dcim.Rack` was not part of\nthat change. It still declares `site
              ForeignKey REQ -> dcim.Site` and `location ForeignKey\n-> dcim.Location`
              as real, writable columns (docs/netbox-schema.md -> dcim.Rack; the\nserializer's
              write path carries `site` and `location` and neither `scope_type` nor\n`scope_id`,
              hack/testdata/ir-4.6.8.json.gz -> dcim.Rack.write_path). So `siteRef`
              here is\nan ordinary reference that really is written, not the cached
              column that returns 201 and\nsets nothing, and there is no ScopeRef
              union on this Kind."
            properties:
              airflow:
                description: |-
                  Airflow is the direction air moves through the rack.

                  Unset leaves NetBox's own value alone; `""` clears it, and is sent as `null` for the
                  reason FormFactor gives.
                enum:
                - ""
                - front-to-rear
                - rear-to-front
                type: string
              assetTag:
                description: |-
                  AssetTag is the organisation's own inventory tag
                  (docs/netbox-schema.md -> dcim.Rack, `asset_tag CharField UNIQUE len=50`).

                  Globally unique across every rack in the NetBox, and deliberately **not** a
                  natural-key candidate: the asset tag identifies a chassis and the CR describes a rack
                  position, so adopting by asset tag would let moving a chassis silently rewrite the site
                  and location of somebody else's rack. A duplicate comes back as NetBox's own 409,
                  reported as `Ready=False, Reason=Invalid`.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 50
                type: string
              comments:
                description: |-
                  Comments is the rack's long-form notes field.

                  A TextField, so there is no MaxLength marker to derive.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                type: string
              customFields:
                additionalProperties:
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  CustomFields are NetBox custom-field values to write, keyed by NetBox custom-field
                  name. Every key must already exist as an `extras.CustomField` covering this object
                  type -- NetBox rejects the whole payload otherwise.

                  The map is deliberately **not** exhaustive: only the keys named here are written and
                  compared, and every other custom field on the NetBox object is left exactly as it is.
                  NetBox merges a partial `custom_fields` PATCH and returns every custom field defined
                  for the object type, including ones this operator knows nothing about, so treating
                  the map as the whole container would null out every custom field another writer on
                  that NetBox owns, on every reconcile. Omitting the map, or setting it to `{}`,
                  therefore means "manage nothing" rather than "clear everything".

                  A value is written as the JSON type it is given, because that is the only thing
                  NetBox accepts. A custom field carries a `type` (extras/choices.py,
                  CustomFieldTypeChoices) and its serializer validates against it, so `chef_managed:
                  "true"` on a `boolean` field is rejected outright -- *"Invalid value for custom field
                  'chef_managed': Value must be true or false"* -- and no amount of retrying makes a
                  string into a boolean. Every non-text type is in the same position: `integer`,
                  `decimal`, `boolean`, `json`, `multiselect` and `multiobject` each need their own JSON
                  shape.

                    customFields:
                      chef_managed: true             # boolean
                      extra_disk_1: 500              # integer
                      rack_position: "12"            # text that happens to look like a number
                      tiers: [gold, silver]          # multiselect

                  So the type is the user's to state and the operator's to carry through unchanged
                  (#303). Quoting is therefore load-bearing rather than noise: `"12"` on a text field
                  and `12` on an integer field are both right, and each is wrong on the other -- which
                  is a distinction a `map[string]string` could not make at all, and why this is not one.

                  `null` and `""` are different intents and both are expressible:

                    customFields:
                      rack_position: ""      # set this custom field to the empty string
                      audit_ticket: null     # remove this custom field's value

                  `null` is sent to NetBox as JSON null, which is the value NetBox stores for a custom
                  field that has no value and the value it returns on read -- indistinguishable from a
                  field never set, which is what "removed" means here. `""` stores and returns the
                  empty string. Removing the key from the manifest entirely is the third state: it
                  hands the field back and NetBox keeps whatever it holds
                  (docs/concepts/field-ownership.md).

                  Set on a kind whose NetBox model carries no `custom_fields` column -- extras.Tag is
                  one, so a NetBoxTag is the case -- and the object reports Ready=False,
                  Reason=Invalid. Refused rather than dropped: a discarded value would leave the
                  object claiming to be synced while NetBox never received it.
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy is what happens to the NetBox object when this CR is deleted.

                  Read fresh on every pass rather than latched when deletion starts, so switching it
                  to Retain on an object whose delete NetBox keeps refusing is a way out of that
                  state (docs/concepts/deletion.md).

                  Left unset it is Delete for most kinds and Retain for the IPAM ones, where deleting
                  the NetBox object destroys state rather than configuration -- an address freed for
                  reallocation, a range whose ownership record is gone (decision #176). The default is
                  therefore *not* a CRD marker: this field is declared once for every kind, so a marker
                  here could only give them all the same answer. Each kind declares its own on its
                  Descriptor and docs/concepts/deletion.md lists them.
                enum:
                - Delete
                - Retain
                type: string
              descUnits:
                description: |-
                  DescUnits numbers the rack units from the top down rather than from the bottom up
                  (docs/netbox-schema.md -> dcim.RackBase, `desc_units BooleanField def=False`).

                  A pointer, and the reason is the column's default. A plain `bool` cannot tell "not
                  managed" from "managed as false", so adopting a hand-made descending rack would
                  silently renumber every unit in it. Nil leaves NetBox's value alone; `false` writes
                  false.
                type: boolean
              description:
                description: |-
                  Description is free text shown next to the rack.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 200
                type: string
              endpointRef:
                description: |-
                  EndpointRef names the NetBoxEndpoint to write through, in this object's own
                  namespace. Required: there is no cluster-wide default endpoint, so an omitted
                  reference cannot be resolved into one.

                  **Immutable.** Pointing a CR at a different NetBox is not a mutation of the object, it
                  is a different object: the natural key is looked up in whichever NetBox this names, so
                  an edit here would leave the old NetBox holding an object nothing manages and would
                  adopt or create a second one in the new one, with the CR's status.id switching between
                  the two. Edit it by deleting the CR -- which lets spec.deletionPolicy do what it says
                  about the object being left behind -- and re-applying it.

                  A CEL transition rule and not the admission webhook, which is the whole layer-1 test:
                  it needs `self` and `oldSelf` and no second object, so the API server enforces it
                  unconditionally and it survives every webhook in the cluster being down (NBO-044).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: endpointRef is immutable; pointing a CR at a different
                    NetBox is a different object, so delete this one and re-apply
                    it
                  rule: self == oldSelf
              facilityID:
                description: |-
                  FacilityID is the rack's designation in the facility's own numbering
                  (docs/netbox-schema.md -> dcim.Rack, `facility_id CharField len=50`).

                  NetBox's second unique constraint is `(location, facility_id)`, so setting it gives the
                  rack a database-backed second identity and is what lets the operator adopt a rack the
                  facility renamed. `facility_id` and not a reference: it is a free-text label the data
                  centre assigns, not an id of anything in NetBox.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 50
                type: string
              formFactor:
                description: |-
                  FormFactor is the rack's physical construction.

                  Optional here and **required on NetBoxRackType**, because the two columns differ: this
                  one is `blank=True, null=True` and dcim.RackType's is `REQ` with no default
                  (docs/netbox-schema.md). Unset leaves NetBox's own value alone; `""` clears it, which is
                  how NetBox spells "unspecified". Those are two different instructions and the operator
                  tells them apart from metadata.managedFields
                  (docs/concepts/field-ownership.md); the wording differs from the other clearable fields
                  here only because this one carries an enum.

                  Cleared as `null` rather than as an empty string, because NetBox's serializer returns
                  `null` for an unset choice and a payload of `""` would differ from the value read back
                  on every pass -- see registry.Field.EmptyIsNull.
                enum:
                - ""
                - 2-post-frame
                - 4-post-frame
                - 4-post-cabinet
                - wall-frame
                - wall-frame-vertical
                - wall-cabinet
                - wall-cabinet-vertical
                type: string
              groupRef:
                description: |-
                  GroupRef is the rack group this rack belongs to
                  (docs/netbox-schema.md -> dcim.Rack, `group ForeignKey -> dcim.RackGroup
                  on_delete=PROTECT`).

                  A flat label rather than a position in a hierarchy -- see NetBoxRackGroup, which is an
                  `OrganizationalModel` and has no `parent` at all. It is in no natural-key candidate:
                  NetBox constrains nothing on it.

                  Two states, as LocationRef explains.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              locationRef:
                description: |-
                  LocationRef is the room or row within the site this rack stands in
                  (docs/netbox-schema.md -> dcim.Rack, `location ForeignKey -> dcim.Location
                  on_delete=SET_NULL`).

                  Optional, and the single most load-bearing optional field in this spec: it is what both
                  of NetBox's unique constraints are keyed on. Setting it gets the rack a database-backed
                  identity, `(location, name)`; leaving it unset gets it the `(site, name)` convention
                  with `location_id` pinned null, where an ambiguous match is a `Conflict` the database
                  will not prevent (docs/reference/netboxrack.md#natural-keys).

                  A pointer to the typed alias, so it has two states rather than three: absent means
                  unmanaged, and a value claims the column. `SET_NULL` means NetBox *can* hold a rack
                  with no location, and clearing the column from a manifest needs registry.EmptyIsNull
                  and a v1alpha1.OptionalRef -- a third state no shipped kind uses yet (#185). Until then
                  the way to move a rack out of a location is to clear it in NetBox and stop declaring
                  the field.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              maxWeight:
                description: |-
                  MaxWeight is the maximum load the rack is rated for, in WeightUnit
                  (docs/netbox-schema.md -> dcim.RackBase, `max_weight PositiveIntegerField`).

                  Two states, as OuterWidth explains.
                format: int32
                minimum: 1
                type: integer
              mountingDepth:
                description: |-
                  MountingDepth is the usable depth between the mounting rails, in millimetres
                  (docs/netbox-schema.md -> dcim.RackBase, `mounting_depth PositiveSmallIntegerField`).

                  Millimetres regardless of OuterUnit: NetBox documents this column as mm on the model
                  itself, and it is the one measurement here that does not follow the unit choice. Two
                  states, as OuterWidth explains.
                format: int32
                minimum: 1
                type: integer
              name:
                description: |-
                  Name is the rack's name.

                  Unique per *location* rather than per site or globally
                  (docs/netbox-schema.md -> dcim.Rack.meta.constraints), and not unique at all for a rack
                  with no location. Two racks called `R1` in two locations are a legitimate NetBox state.
                maxLength: 100
                minLength: 1
                type: string
              onConflict:
                default: Fail
                description: OnConflict is what to do when NetBox already holds a
                  matching object.
                enum:
                - Fail
                - Adopt
                - AdoptOnly
                type: string
              outerDepth:
                description: |-
                  OuterDepth is the external depth of the rack, in OuterUnit. Two states, as OuterWidth
                  explains.
                format: int32
                minimum: 1
                type: integer
              outerHeight:
                description: |-
                  OuterHeight is the external height of the rack, in OuterUnit. Two states, as
                  OuterWidth explains.
                format: int32
                minimum: 1
                type: integer
              outerUnit:
                description: |-
                  OuterUnit is the unit the three `outer*` measurements are given in.

                  Unset leaves NetBox's own value alone; `""` clears it. Cleared as `null` rather than as
                  an empty string, because NetBox's serializer returns `null` for an unset choice and a
                  payload of `""` would differ from the value read back on every pass -- see
                  registry.Field.EmptyIsNull.
                enum:
                - ""
                - mm
                - in
                type: string
              outerWidth:
                description: |-
                  OuterWidth is the external width of the rack, in OuterUnit.

                  A pointer with **two** states rather than three, and that is a statement about the
                  column rather than an omission here: `outer_width PositiveSmallIntegerField` is
                  `blank=True, null=True` and every value it can hold is a real measurement, so there is
                  no empty *value* to write. Nil leaves NetBox's own value alone; a number claims and
                  sets it. Clearing the column back to null is NBO-060's audit item, not a state this
                  field can express.
                format: int32
                minimum: 1
                type: integer
              rackTypeRef:
                description: |-
                  RackTypeRef is the catalogue entry this rack is built from
                  (docs/netbox-schema.md -> dcim.Rack, `rack_type ForeignKey -> dcim.RackType
                  on_delete=PROTECT`).

                  Setting it makes NetBox copy the type's `RackBase` dimensions onto this rack on create,
                  server-side -- the operator does not re-send them and does not have to. `PROTECT`, so
                  deleting a rack type in use is refused on the *type*.

                  Two states, as LocationRef explains.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
