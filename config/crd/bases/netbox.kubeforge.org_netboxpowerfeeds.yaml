          spec:
            description: "NetBoxPowerFeedSpec describes one dcim.PowerFeed.\n\nOne
              circuit from a NetBoxPowerPanel, and the kind NBO-052 exists for: it
              is the first in the\ncatalogue whose defaults are **not the model's
              own**.\n\n\tvoltage          SmallIntegerField          def=UNRESOLVED:ConfigItem('POWERFEED_DEFAULT_VOLTAGE')\n\tamperage
              \        PositiveSmallIntegerField  def=UNRESOLVED:ConfigItem('POWERFEED_DEFAULT_AMPERAGE')\n\tmax_utilization
              \ PositiveSmallIntegerField  def=UNRESOLVED:ConfigItem('POWERFEED_DEFAULT_MAX_UTILIZATION')\n\n(docs/netbox-schema.md
              -> dcim.PowerFeed; the same three carry `default_unresolved: true`\nin
              the committed IR, hack/testdata/ir-4.6.8.json.gz -> dcim.PowerFeed.)\n\nA
              `ConfigItem` is read from the *target\nNetBox's* configuration at write
              time, not from the model, so there is no value the CRD\ncould carry
              that would be right on every instance. Baking NetBox's shipped 120/15/80
              into\nthe CRD would silently reconfigure every feed on an installation
              configured for 230 V.\n\nSo Voltage, Amperage and MaxUtilization are
              optional pointers with **no\n`+kubebuilder:default`**, and the whole
              of the rule falls out of that one decision: a nil\npointer marshals
              to nothing, `payload.desired` skips a spec key with no value, `netbox.Drift`\nonly
              considers fields present in desired, and `restoreEmpty` has no empty
              form for a pointer\nso field ownership never puts one back. Omitted
              therefore means \"whatever this NetBox is\nconfigured for\" end to end,
              and a subsequent reconcile reports no drift against whatever\nNetBox
              defaulted to. See internal/reconciler/dcim_powerfeed_test.go, which
              pins each of those\nfour steps, and docs/reference/netboxpowerfeed.md#server-side-defaults.\n\nThe
              four enums below are the contrast, and they *are* defaulted. Their column
              defaults are\nmodel-level constants -- `PowerFeedStatusChoices.STATUS_ACTIVE`
              and friends -- not\n`ConfigItem` lookups, so the value is the same on
              every NetBox and a defaulted field the\noperator manages from the first
              reconcile is strictly better than one it can never correct.\n\nIdentity
              is `(power_panel, name)`:\n\n\tmeta.constraints: (models.UniqueConstraint(fields=('power_panel',
              'name'),\n\t   name='%(app_label)s_%(class)s_unique_power_panel_name'),)\n\n(docs/netbox-schema.md
              -> dcim.PowerFeed; hack/testdata/ir-4.6.8.json.gz ->\ndcim.PowerFeed.natural_keys,
              filters `power_panel_id` and `name`.) `rack` and `tenant` are\nboth
              optional and neither is constrained, so neither is in the key."
