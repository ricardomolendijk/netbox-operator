---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: netboxendpoints.netbox.populator.io
spec:
  group: netbox.populator.io
  names:
    kind: NetBoxEndpoint
    listKind: NetBoxEndpointList
    plural: netboxendpoints
    shortNames:
    - nbep
    - nbendpoint
    singular: netboxendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.netboxVersion
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetBoxEndpoint is a connection to one NetBox instance.

          Namespaced, so endpointRef resolves in the referring object's own namespace and each
          namespace can point at a different NetBox with no extra machinery. See
          docs/decisions/0002-crd-scoping.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetBoxEndpointSpec describes one NetBox instance.
            properties:
              mode:
                default: Apply
                description: Mode is Apply or DryRun.
                enum:
                - Apply
                - DryRun
                type: string
              rateLimit:
                description: RateLimit caps client-side request rate.
                properties:
                  burst:
                    description: Burst is the bucket size. Defaults to QPS.
                    format: int32
                    minimum: 0
                    type: integer
                  qps:
                    description: QPS is sustained requests per second. Zero means
                      unlimited.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              resyncPeriod:
                default: 10m
                description: ResyncPeriod re-checks NetBox for drift even when no
                  CR changed.
                type: string
              timeout:
                default: 30s
                description: Timeout for a single request. Defaults to 30s.
                type: string
              tlsConfig:
                description: TLSConfig tunes the TLS handshake.
                properties:
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef holds additional trusted roots, PEM-encoded. That Secret must be
                      labelled netbox.populator.io/endpoint-credential: "true" or the operator cannot
                      read it; see docs/operations/rbac.md.
                    properties:
                      key:
                        description: |-
                          Key within the Secret. Left unset, the controller uses a default appropriate to
                          the field: "token" for tokenSecretRef, "ca.crt" for caBundleSecretRef.

                          Deliberately not a +kubebuilder:default: this type is used for both, a marker
                          applies at every use site, and defaulting a CA bundle's key to "token" makes the
                          controller's own fallback unreachable and the endpoint fail with InvalidConfig.
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify disables certificate verification. Logged at info on every
                      successful reconcile, because it is not a thing to forget about.
                    type: boolean
                type: object
              tokenSecretRef:
                description: |-
                  TokenSecretRef names the Secret holding the API token. That Secret must be
                  labelled netbox.populator.io/endpoint-credential: "true" or the operator cannot
                  read it; see docs/operations/rbac.md.
                properties:
                  key:
                    description: |-
                      Key within the Secret. Left unset, the controller uses a default appropriate to
                      the field: "token" for tokenSecretRef, "ca.crt" for caBundleSecretRef.

                      Deliberately not a +kubebuilder:default: this type is used for both, a marker
                      applies at every use site, and defaulting a CA bundle's key to "token" makes the
                      controller's own fallback unreachable and the endpoint fail with InvalidConfig.
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              url:
                description: URL of the NetBox instance, with or without a trailing
                  /api.
                pattern: ^https?://
                type: string
            required:
            - tokenSecretRef
            - url
            type: object
          status:
            description: NetBoxEndpointStatus reports what the operator found.
            properties:
              conditions:
                description: Conditions follow the standard Kubernetes vocabulary.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              netboxVersion:
                description: NetBoxVersion is the version string reported by GET /api/status/.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  refers to.
                format: int64
                type: integer
              plugins:
                description: |-
                  Plugins are the NetBox plugins the server reports. Recorded because a plugin that
                  adds a required custom field is an otherwise baffling source of 400s.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
