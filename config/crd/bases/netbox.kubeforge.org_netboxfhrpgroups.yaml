spec:
  group: netbox.kubeforge.org
  names:
    kind: NetBoxFHRPGroup
    listKind: NetBoxFHRPGroupList
    plural: netboxfhrpgroups
    shortNames:
    - nbfhrp
    singular: netboxfhrpgroup
  scope: Namespaced
