    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetBoxDevice is one dcim.Device in NetBox.

          Namespaced like every kind in v1alpha1 (docs/decisions/0002-crd-scoping.md), which is what
          makes a cross-namespace `assetTag` collision possible: NetBox's uniqueness on that column
          is global and a namespace boundary does not partition it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetBoxDeviceSpec describes one dcim.Device.

              Three of NetBox's own columns are deliberately narrowed or absent, and each is a decision
              rather than an omission:

                - `name` is **required here and nullable in NetBox**. NetBox holds unnamed devices --
                  blade chassis members, unracked spares -- and an unnamed device has no natural key at
                  all: every constraint on the model is over `Lower('name')` or over a rack position
                  (docs/netbox-schema.md -> dcim.Device, meta.constraints). It could not be looked up,
                  adopted or reconciled idempotently, and a lost `status.id` would make the operator
                  create a second one on the next pass. See docs/reference/netboxdevice.md.
                - `location`, `rack`, `position` and `face` are absent. dcim.Location has a Kind
                  (NBO-048 lands the rest of it) and dcim.Rack does not (NBO-051), and
                  `position`/`face` are meaningless without a rack -- so the
                  `('rack', 'position', 'face')` constraint is unreachable and all four are left out
                  rather than accepted and dropped.
                - `virtual_chassis`, `vc_position`, `vc_priority`, `config_template` and
                  `local_context_data` are absent for the same reason: NBO-053 and NBO-059 own the
                  Kinds behind them, and NetBox ignores a column it does not know rather than
                  rejecting it, so a field accepted and silently dropped reports success while writing
                  nothing.

              There is no `tags` field, on this Kind or any other in v1alpha1: `tags` is written by the
              engine from Descriptor.Taggable as the provenance stamp (internal/reconciler, fieldRules),
              and a user-facing tag list arrives with NBO-055's NetBoxTag references.
            properties:
              airflow:
                description: |-
                  Airflow is which way air moves through the chassis (docs/netbox-schema.md ->
                  dcim.Device, `airflow CharField len=50 choices=DeviceAirflowChoices`).

                  Not defaulted: the column carries no `def=`, and an unset airflow is a real state in
                  NetBox -- a device type may declare one the device inherits -- so defaulting it would
                  make every adopted device drift towards a value nobody chose.
                enum:
                - ""
                - front-to-rear
                - rear-to-front
                - left-to-right
                - right-to-left
                - side-to-rear
                - rear-to-side
                - bottom-to-top
                - top-to-bottom
                - passive
                - mixed
                type: string
              assetTag:
                description: |-
                  AssetTag is the tag used to identify this device, and the only **globally unique**
                  column on the model (docs/netbox-schema.md -> dcim.Device,
                  `asset_tag CharField UNIQUE len=50`).

                  That makes it the strongest natural key this Kind has and the first one tried, and it
                  is also the one field whose collision is cluster-wide rather than site-local: two CRs
                  in two namespaces claiming one asset tag are one device, so the loser reports
                  `Conflict` naming the winner.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. Cleared as `null` rather than as an empty string -- the column is unique and
                  nullable (`null=True, unique=True`, `netbox/dcim/models/devices.py` lines 555-562), so
                  two devices with an empty-string tag would collide where two with `null` do not. See
                  registry.Field.EmptyIsNull.
                maxLength: 50
                type: string
              clusterRef:
                description: |-
                  ClusterRef is the virtualization cluster this device is a host in
                  (docs/netbox-schema.md -> dcim.Device,
                  `cluster ForeignKey -> virtualization.Cluster on_delete=SET_NULL`).

                  A containment-shaped reference that is deliberately **not** a containment parent, and
                  the reason is `SET_NULL` rather than taste: deleting the cluster leaves the device row
                  alive with the column cleared, so an owner reference would garbage-collect a CR whose
                  NetBox object still exists (docs/decisions/0003-ownership-and-references.md rule 4,
                  registry.ErrContainmentNotCascade).
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              comments:
                description: |-
                  Comments is the device's long-form notes field. Also inherited from PrimaryModel, and
                  a TextField rather than a CharField: it has no max_length, so there is no MaxLength
                  marker to derive.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                type: string
              customFields:
                additionalProperties:
                  nullable: true
                  type: string
                description: |-
                  CustomFields are NetBox custom-field values to write, keyed by NetBox custom-field
                  name. Every key must already exist as an `extras.CustomField` covering this object
                  type -- NetBox rejects the whole payload otherwise.

                  The map is deliberately **not** exhaustive: only the keys named here are written and
                  compared, and every other custom field on the NetBox object is left exactly as it is.
                  NetBox merges a partial `custom_fields` PATCH and returns every custom field defined
                  for the object type, including ones this operator knows nothing about, so treating
                  the map as the whole container would null out every custom field another writer on
                  that NetBox owns, on every reconcile. Omitting the map, or setting it to `{}`,
                  therefore means "manage nothing" rather than "clear everything".

                  `null` and `""` are different intents and both are expressible:

                    customFields:
                      rack_position: ""      # set this custom field to the empty string
                      audit_ticket: null     # remove this custom field's value

                  `null` is sent to NetBox as JSON null, which is the value NetBox stores for a custom
                  field that has no value and the value it returns on read -- indistinguishable from a
                  field never set, which is what "removed" means here. `""` stores and returns the
                  empty string. Removing the key from the manifest entirely is the third state: it
                  hands the field back and NetBox keeps whatever it holds
                  (docs/concepts/field-ownership.md).

                  Set on a kind whose NetBox model carries no `custom_fields` column -- extras.Tag is
                  one, so a NetBoxTag is the case -- and the object reports Ready=False,
                  Reason=Invalid. Refused rather than dropped: a discarded value would leave the
                  object claiming to be synced while NetBox never received it.
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy is what happens to the NetBox object when this CR is deleted.

                  Read fresh on every pass rather than latched when deletion starts, so switching it
                  to Retain on an object whose delete NetBox keeps refusing is a way out of that
                  state (docs/concepts/deletion.md).

                  Left unset it is Delete for most kinds and Retain for the IPAM ones, where deleting
                  the NetBox object destroys state rather than configuration -- an address freed for
                  reallocation, a range whose ownership record is gone (decision #176). The default is
                  therefore *not* a CRD marker: this field is declared once for every kind, so a marker
                  here could only give them all the same answer. Each kind declares its own on its
                  Descriptor and docs/concepts/deletion.md lists them.
                enum:
                - Delete
                - Retain
                type: string
              description:
                description: |-
                  Description is free text shown next to the device. Declared on PrimaryModel rather
                  than on dcim.Device (docs/netbox-schema.md -> dcim.Device,
                  `description (PrimaryModel) CharField len=200`); an inherited column is as writable as
                  a declared one.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).
                maxLength: 200
                type: string
              deviceTypeRef:
                description: |-
                  DeviceTypeRef is the model of hardware this device is (docs/netbox-schema.md ->
                  dcim.Device, `device_type ForeignKey REQ -> dcim.DeviceType on_delete=PROTECT`).

                  Required, because NetBox's column is. It is not part of the identity, and it does not
                  cascade: `PROTECT` means NetBox refuses to delete a device type that still has
                  devices, so there is no server-side deletion for an owner reference to mirror
                  (docs/decisions/0003-ownership-and-references.md rule 4).
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              endpointRef:
                description: |-
                  EndpointRef names the NetBoxEndpoint to write through, in this object's own
                  namespace. Required: there is no cluster-wide default endpoint, so an omitted
                  reference cannot be resolved into one.

                  **Immutable.** Pointing a CR at a different NetBox is not a mutation of the object, it
                  is a different object: the natural key is looked up in whichever NetBox this names, so
                  an edit here would leave the old NetBox holding an object nothing manages and would
                  adopt or create a second one in the new one, with the CR's status.id switching between
                  the two. Edit it by deleting the CR -- which lets spec.deletionPolicy do what it says
                  about the object being left behind -- and re-applying it.

                  A CEL transition rule and not the admission webhook, which is the whole layer-1 test:
                  it needs `self` and `oldSelf` and no second object, so the API server enforces it
                  unconditionally and it survives every webhook in the cluster being down (NBO-044).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: endpointRef is immutable; pointing a CR at a different
                    NetBox is a different object, so delete this one and re-apply
                    it
                  rule: self == oldSelf
              interfaces:
                description: |-
                  Interfaces are this device's dcim.Interface components, declared inline and
                  materialised as real NetBoxInterface CRs -- with their addresses as real
                  NetBoxIPAddress CRs under them (ADR-0003 rule 5, docs/concepts/inline-children.md).

                  **Not a NetBox column, and the only field on this spec that is not.** `dcim.Device` has
                  no `interfaces` column: the foreign key points the other way, from each interface at
                  its device, so nothing here reaches the device's own payload and the field is
                  deliberately absent from the descriptor's field map
                  (internal/registry/dcim_device.go). What it produces is child CRs, each of which
                  writes its own NetBox object -- the device never writes NetBox on a child's behalf.

                  **Sugar, and optional, which is the term on which it is in v1alpha1 at all**
                  (ADR-0003 rule 5). Every entry is equally expressible as a NetBoxInterface with a
                  `deviceRef` naming this device, the longhand kind stays the complete one -- an inline
                  entry offers a subset of its fields -- and the two coexist on one device: a
                  hand-written NetBoxInterface pointing at this device is never pruned, never adopted and
                  absent from `status.children`.

                  **Omitting it and writing `[]` are the same instruction**, unlike every other optional
                  field on this spec. There is no NetBox value to leave alone, so there is no third
                  state: both mean "declare no children", and both prune the children a previous spec
                  declared. Removing one entry prunes exactly that entry's child and its addresses.

                  A list with a key rather than an ordered one, so the API server rejects two entries
                  named the same, and so reordering the list changes no child's name, path or
                  resourceVersion -- identity is the key, never the index
                  (docs/concepts/inline-children.md).
                items:
                  description: |-
                    InlineInterface is one entry of NetBoxDeviceSpec.Interfaces: a dcim.Interface on this
                    device, declared inline and materialised as a real NetBoxInterface CR.

                    The fields are the longhand kind's own types -- InterfaceType, InterfaceMode, VLANRef --
                    so every enum, pattern and length limit is declared once, in dcim_interface.go, and an
                    inline entry cannot drift from the Kind it becomes. What is missing from this struct is
                    the interesting part, and every absence is a decision:

                      - `deviceRef` and `assignedObject`, because the materialiser sets them from the parent.
                        A field the user cannot meaningfully set does not exist.
                      - `lagRef`, `parentRef` and `bridgeRef`, replaced by the sibling *keys* `lag`, `parent`
                        and `bridge` -- see InlineInterface.LAG.
                      - `markConnected`, `wwn`, `txPower`, `rfRole`, `rfChannel`, `rfChannelFrequency`,
                        `rfChannelWidth` and `qinqSVLANRef`. The inline form deliberately does not mirror the
                        longhand spec (ADR-0003 rule 5: the standalone kind stays the complete one), and every
                        one of those is either wireless-only or a column somebody setting up a chassis by hand
                        is not setting. Write a NetBoxInterface for an interface that needs them; nothing about
                        doing so is a downgrade, and it is one line longer.

                    One thing an entry cannot do, and it follows from omitempty rather than from a decision here:
                    an inline field set to `""` **does not clear** NetBox's value. The child is applied through
                    server-side apply, `omitempty` drops the empty string from the request, so no manager claims
                    the field, so the child's own pass reads it as absent -- which means "do not manage" rather
                    than "clear" (docs/concepts/field-ownership.md). An inline entry can set a description and
                    leave one alone; clearing one is a NetBoxInterface, where the field is the user's own and the
                    distinction survives.
                  properties:
                    addresses:
                      description: |-
                        Addresses are the ipam.IPAddress objects assigned to this interface, materialised as
                        NetBoxIPAddress children of the **device** -- the device is what declared them, and a
                        controller owner reference names the object that created another, not the object it
                        points at (ADR-0003 rule 3). The containment owner reference naming the interface is
                        added by the address's own pass, and the two coexist.

                        A list with a key, so reordering it changes no child's name, path or resourceVersion.
                      items:
                        description: |-
                          InlineIPAddress is one entry of InlineInterface.Addresses: an ipam.IPAddress assigned to
                          the interface it is nested under, materialised as a real NetBoxIPAddress CR.

                          Four fields, against NetBoxIPAddressSpec's twelve, and the absences are the same kind of
                          decision as on InlineInterface:

                            - `assignedObject` is set by the materialiser to the sibling interface child.
                            - `claimFrom` is absent. An inline address that names a pool instead of a literal
                              materialises a NetBoxIPAddressClaim, which is ADR-0004's single allocation code path
                              and NBO-036's ticket; `fromPrefixRef`, the spelling an older draft used, does not exist
                              and never will (docs/reference/netboxdevice.md).
                            - `allowDuplicate` is absent, deliberately and permanently. It makes the provenance stamp
                              part of the object's identity, so a materialised child that lost `status.id` would
                              create a *second* NetBox address rather than adopting its own
                              (internal/reconciler/duplicate.go, issue #167). An anycast or VRRP address that needs it
                              is written as its own NetBoxIPAddress.
                            - `tenantRef` is absent because NetBoxIPAddress has no `tenantRef` to carry it to: the
                              column waits on the longhand kind (api/v1alpha1/ipam_ipaddress.go). Accepting it here
                              would report success and write nothing.
                            - `role`, `natInsideRef`, `description` and `comments` are the longhand kind's, for the
                              reason InlineInterface leaves out the wireless columns.
                        properties:
                          address:
                            description: |-
                              Address is the address and its mask, `10.0.20.10/24` or `2001:db8::1/64`, and this
                              entry's key.

                              **The prefix length is part of the key**, so `10.0.20.10/24` and `10.0.20.10/25` are two
                              entries, two NetBox objects and two child CRs -- which is what NetBox holds, since an
                              ipam.IPAddress records a host and the prefix it sits in.

                              The pattern and the length limits are the longhand kind's, so there is one definition
                              of what an address looks like (api/v1alpha1/ipam_ipaddress.go).
                            maxLength: 43
                            minLength: 4
                            pattern: ^[0-9A-Fa-f.:]+/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$
                            type: string
                          dnsName:
                            description: DNSName is the hostname this address resolves
                              to.
                            maxLength: 255
                            type: string
                          status:
                            description: |-
                              Status is the address's lifecycle state. Undefaulted here although the longhand kind
                              defaults it to `active`: a default on the inline entry would put `status` into every
                              child's applied spec, so the child's own default -- which is NetBox's -- is what
                              applies, and there is exactly one place the value comes from.
                            enum:
                            - active
                            - reserved
                            - deprecated
                            - dhcp
                            - slaac
                            type: string
                          vrfRef:
                            description: |-
                              VRFRef is the VRF this address belongs to. Unset means the global table, which is a
                              different identity rather than a missing filter (docs/concepts/lookups.md).
                            properties:
                              id:
                                description: |-
                                  ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                                  where a raw id is accepted.

                                  A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                                  at 1, so zero is never a real object and has to be rejected rather than silently
                                  treated as "no id".
                                format: int64
                                minimum: 1
                                type: integer
                              lookup:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                                  `{vid: "20", site: "home"}` because its identity is a pair.

                                  `q` is rejected by the CEL rules along with the pagination and formatting
                                  parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                                  must identify exactly one object would make ambiguity the normal case rather than
                                  an error.
                                maxProperties: 8
                                type: object
                              name:
                                description: |-
                                  Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                                  This is the mode to prefer: it is the only one that expresses a dependency the
                                  operator can wait on, which is what lets a graph applied in any order converge.
                                maxLength: 253
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                              namespace:
                                description: |-
                                  Namespace of that CR. Defaults to the referring object's namespace.

                                  Load-bearing on the common path rather than an edge case: every Kind is namespaced
                                  in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
