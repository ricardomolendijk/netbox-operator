---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: netboxiprangeclaims.netbox.kubeforge.org
spec:
  group: netbox.kubeforge.org
  names:
    kind: NetBoxIPRangeClaim
    listKind: NetBoxIPRangeClaimList
    plural: netboxiprangeclaims
    shortNames:
    - nbiprangeclaim
    - nbrngc
    singular: netboxiprangeclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.startAddress
      name: Start
      type: string
    - jsonPath: .status.endAddress
      name: End
      type: string
    - jsonPath: .status.size
      name: Size
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetBoxIPRangeClaim reserves one run of consecutive addresses inside a prefix, once.

          Namespaced like every kind in v1alpha1 (docs/decisions/0002-crd-scoping.md).

          **The safety argument is the server's rejection, not a lock, and that is the whole of what
          makes this kind different.** There is no advisory-locked endpoint to ask, so two claims can
          and do compute the same placement. NetBox is still the arbiter: `IPRange.clean()` rejects a
          range overlapping another in the same VRF (netbox/ipam/models/ip.py), and every API write
          runs it, because NetBox's ValidatedModelSerializer calls `full_clean()` before saving. The
          loser gets a 400, recomputes from fresh state and tries again -- up to five times in one
          reconcile -- and reports AllocationContended if it keeps losing. No client-side mutex is
          taken, and none would help: the other writer may be another cluster, or a human in the UI.

          The consequence a reader should carry away is that this kind can say "contended" and the
          other two cannot. docs/concepts/claims.md says why in more words.

          **Placement is arithmetic, never enumeration.** The occupied set is the other *ranges* in
          the parent's VRF, of which there are a handful, and never the addresses inside them: an IPv6
          /64 parent has 2^64 addresses and only one of those two numbers can be asked about.
          Individual ipam.IPAddress objects inside a candidate range are not a conflict -- NetBox
          permits a range to contain addresses -- so they are not consulted, and a range allocation
          issues no request to `available-ips` and none to `ipam/ip-addresses`.

          **A claim always retains its NetBox object.** There is no `deletionPolicy` field, for the
          reason NetBoxIPAddressClaim's type comment gives.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetBoxIPRangeClaimSpec asks for one free run of consecutive addresses inside a prefix.

              "Reserve me 64 consecutive addresses in 10.0.30.0/24", and unlike its two sibling kinds
              there is no NetBox endpoint that answers that question: 4.6.8 has no `available-ranges`, and
              `POST ipam/ip-ranges/{id}/available-ips/` allocates an address *out of* a range, the
              opposite operation. So the placement is computed by this operator and committed with an
              ordinary POST, and what keeps two claims from being handed the same block is
              `ipam.IPRange.clean()` refusing to save a range that overlaps another in the same VRF. See
              the type comment on NetBoxIPRangeClaim.
            properties:
              alignment:
                default: Any
                description: |-
                  Alignment is where in the parent's free space the range may start.

                  Defaulted to `Any`, which packs. `PowerOfTwo` is what a DHCP pool usually wants; see
                  RangeAlignmentPowerOfTwo. It changes only which candidate is chosen, never whether the
                  server accepts it, so switching it on a claim that has already allocated does nothing --
                  which is why it is not immutable and why the CRD accepts an edit that has no effect.
                enum:
                - Any
                - PowerOfTwo
                type: string
              allocationIdentity:
                description: |-
                  AllocationIdentity overrides the derived allocation identity.

                  Unset -- the normal case -- the identity is derived from the endpoint's URL, this
                  claim's namespace, its Kind and its name, which is what makes a claim re-applied to a
                  rebuilt cluster reclaim the same address
                  (docs/decisions/0005-gitops-coexistence.md section 3). Set it to the previous
                  identity to carry an address across a *rename*, which the derived value cannot
                  survive by construction.

                  Immutable once set, and settable on a claim that has one already only in the sense
                  that adding it is allowed and changing it is not: an identity that moves is a claim
                  pointed at somebody else's address.

                  Absent and empty mean the same thing here -- derive it -- so this field has two states
                  rather than the three of docs/concepts/field-ownership.md. Nothing is written to NetBox
                  from it directly, so there is no NetBox value for an empty string to clear.
                maxLength: 64
                pattern: ^[a-z0-9]+$
                type: string
                x-kubernetes-validations:
                - message: allocationIdentity is immutable; changing it points this
                    claim at a different allocation
                  rule: self == oldSelf
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy is what happens to the allocated NetBox object when this claim is
                  deleted. The same two values and the same meanings as on every other kind
                  (docs/concepts/deletion.md).

                  **`Delete`, unlike the IPAM object kinds, and that asymmetry is the decision** (#225,
                  reversing #182). A claim's CR is the only record that its allocation exists: "give me
                  any free address out of mgmt-net" is not a statement about 10.0.20.37, and nothing in
                  Git names that address. So when the claim goes, nothing refers to the address it was
                  handed and it becomes litter that is invisible by construction. A NetBoxIPAddress with
                  an explicit spec.address is the opposite -- a deliberate statement about one address,
                  where Retain protects real intent -- and it still defaults to Retain (#176).

                  The cost of this default, stated rather than sold: **a freed address can be reallocated
                  immediately, so an accidental `kubectl delete` on a claim is unrecoverable.**
                  Re-applying the same manifest derives the same allocation identity, but if something
                  else has taken the address meanwhile the claim gets a different one, and whatever was
                  configured to use the old address is now pointed at somebody else's. Under Retain that
                  mistake was recoverable by hand. Set this to Retain on a claim whose address something
                  outside Kubernetes depends on and cannot be told about.

                  Read fresh on every pass rather than latched when deletion starts, so switching it to
                  Retain on a claim whose delete NetBox keeps refusing is the way out of that state.
                enum:
                - Delete
                - Retain
                type: string
              endpointRef:
                description: |-
                  EndpointRef names the NetBoxEndpoint to allocate through, in this claim's own
                  namespace.

                  Declared here rather than inherited from NetBoxObjectSpec: see the type comment above
                  for why a claim does not embed that envelope.

                  It also participates in the allocation identity: the same claim pointed at a different
                  NetBox is a different allocation, and asking a second NetBox for the object of the
                  first one would find nothing and allocate twice.
                minLength: 1
                type: string
              markPopulated:
                description: |-
                  MarkPopulated stops NetBox creating ipam.IPAddress objects inside the reserved range
                  (docs/netbox-schema.md -> ipam.IPRange, `mark_populated BooleanField def=False`).

                  Usually the point of reserving one: the block is handed out by a DHCP server, whose
                  leases are not NetBox's to enumerate. A pointer because of the `def=False` -- a plain
                  bool cannot tell "not managed" from "managed as false".

                  One of the two pass-through fields this kind carries, and the two are exactly the fields
                  that describe *the reservation itself* rather than the thing reserved. Everything else
                  about the created range -- description, role, tenant, status -- is the desired state of a
                  NetBox object, which belongs to a NetBoxIPRange CR.
                type: boolean
              markUtilized:
                description: |-
                  MarkUtilized forces NetBox to report the range as 100% utilised
                  (docs/netbox-schema.md -> ipam.IPRange, `mark_utilized BooleanField def=False`).
                  A pointer for the same reason as MarkPopulated.
                type: boolean
              parentPrefixRef:
                description: |-
                  ParentPrefixRef is the prefix to reserve inside: a NetBoxPrefix, resolved by name, slug,
                  lookup or id like any other reference, and subject to the same NetBoxRefGrant check when
                  it crosses a namespace.

                  The parent supplies two things beyond its bounds. Its VRF, which the created range is
                  given explicitly -- a plain POST inherits nothing, and a range in the wrong VRF is
                  checked for overlap against the wrong set of ranges. And its mask, which both endpoints
                  are written with, because NetBox requires the two to match.

                  Immutable, and this kind has more reason for that than most: repointing it while keeping
                  the claim's name is the mistake the ReclaimedOutsidePool guard exists for.
                properties:
                  id:
                    description: |-
                      ID is a literal NetBox primary key: the escape hatch, and the only place in the API
                      where a raw id is accepted.

                      A pointer so that `id: 0` is distinguishable from unset. NetBox primary keys start
                      at 1, so zero is never a real object and has to be rejected rather than silently
                      treated as "no id".
                    format: int64
                    minimum: 1
                    type: integer
                  lookup:
                    additionalProperties:
                      type: string
                    description: |-
                      Lookup is a raw NetBox API filter, for an object no slug identifies -- a VLAN is
                      `{vid: "20", site: "home"}` because its identity is a pair.

                      `q` is rejected by the CEL rules along with the pagination and formatting
                      parameters. It is NetBox's fuzzy search, and a fuzzy filter behind a reference that
                      must identify exactly one object would make ambiguity the normal case rather than
                      an error.
                    maxProperties: 8
                    type: object
                  name:
                    description: |-
                      Name of a CR of the target Kind, resolved through that CR's `.status.id`.

                      This is the mode to prefer: it is the only one that expresses a dependency the
                      operator can wait on, which is what lets a graph applied in any order converge.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of that CR. Defaults to the referring object's namespace.

                      Load-bearing on the common path rather than an edge case: every Kind is namespaced
                      in v1alpha1 (docs/decisions/0002-crd-scoping.md), so a team namespace pointing at a
                      shared catalogue namespace is the normal shape. Crossing a namespace requires a
                      NetBoxRefGrant in the target namespace (NBO-014).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  slug:
                    description: |-
                      Slug looks the object up in NetBox directly, for objects the operator does not
                      manage. No CR needs to exist.

                      Bounded at 100 characters because that is what NetBox's own column allows:
                      `slug SlugField len=100` on every OrganizationalModel, NestedGroupModel and
                      PrimaryModel (docs/netbox-schema.md -> dcim.Site, dcim.Region, extras.Tag).
                    maxLength: 100
                    pattern: ^[-a-zA-Z0-9_]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: parentPrefixRef is immutable; a claim allocates once, so
                    pointing it at another prefix is a new claim
                  rule: self == oldSelf
                - message: exactly one of name, slug, lookup or id must be set
                  rule: '[has(self.name) && size(self.name) > 0, has(self.slug) &&
                    size(self.slug) > 0, has(self.lookup) && size(self.lookup) > 0,
                    has(self.id)].filter(x, x).size() == 1'
                - message: namespace may only be set together with name
                  rule: '!has(self.namespace) || (has(self.name) && size(self.name)
                    > 0)'
                - message: lookup keys must be lowercase NetBox filter names
                  rule: '!has(self.lookup) || self.lookup.all(k, k.matches(''^[a-z][a-z0-9_]*$''))'
                - message: lookup may not set pagination, formatting or fuzzy-search
                    parameters
                  rule: '!has(self.lookup) || self.lookup.all(k, !(k in [''limit'',''offset'',''format'',''brief'',''ordering'',''q'']))'
                - message: lookup values are limited to 200 characters
                  rule: '!has(self.lookup) || self.lookup.all(k, size(self.lookup[k])
                    <= 200)'
              size:
                description: |-
                  Size is how many consecutive addresses to reserve, counted inclusively: 64 means a range
                  whose end address is 63 above its start.

                  Required and immutable. Growing a range is not this claim doing more of what it did --
                  the addresses above it may not be free -- so it is a different claim.

                  Capped at 65536 so that the `size` column NetBox derives stays a number a human reads
                  rather than one they parse. NetBox's own ceiling is 2^32-1 (`IPRange.clean`), which for
                  an IPv6 parent is a range nobody meant to ask for and for an IPv4 one is more addresses
                  than exist.
                format: int32
                maximum: 65536
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: size is immutable; a claim allocates once, so a different
                    size is a new claim
                  rule: self == oldSelf
            required:
            - endpointRef
            - parentPrefixRef
            - size
            type: object
          status:
            description: |-
              NetBoxIPRangeClaimStatus is what the claim reserved, and everything needed to prove it was
              reserved once.
            properties:
              allocatedAt:
                description: |-
                  AllocatedAt is when the address was first allocated or reclaimed. Never rewritten
                  afterwards.
                format: date-time
                type: string
              allocationIdentity:
                description: |-
                  AllocationIdentity is the identity written into the allocated object's custom field,
                  and the key every future reclaim searches by.

                  Reported because it is the one value that makes a leaked allocation findable: paste it
                  into NetBox's custom-field filter and the object it belongs to comes back, whether or
                  not the CR still exists.
                type: string
              claimUID:
                description: |-
                  ClaimUID is the metadata.uid of the claim that allocated this object.

                  Recorded for debugging and for exactly one decision: an allocated object whose
                  k8s_uid is not the current claim's is a reclaim by a re-created claim, which is
                  legitimate and is worth an Event naming both. The identity, not this, is what
                  reclaims -- a UID is regenerated precisely when the old address is most wanted back.
                type: string
              conditions:
                description: Conditions follow the standard Kubernetes vocabulary.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletionAttempts:
                description: |-
                  DeletionAttempts counts the deletes of the allocated object that did not succeed:
                  refused by NetBox, failed, or not attempted because the endpoint was not Ready.

                  A status field for the same reason NetBoxObjectStatus's is -- a controller has no
                  memory between passes, so a backoff computed from a count has to survive a requeue, a
                  leader election and a restart. Non-zero only while a claim is terminating.

                  It is also the bound on that retry: past a fixed number of attempts the claim releases
                  its finalizer anyway and reports the address as retained, because a claim's finalizer
                  must not be able to wedge a namespace (#225). Counting anything other than a success
                  here would make that bound unenforceable.
                format: int32
                type: integer
              endAddress:
                description: |-
                  EndAddress is the last address of the reserved range, inclusive.

                  Derived from StartAddress and Size rather than read back separately, and it cannot
                  disagree with NetBox: the client refuses the allocation unless the `size` NetBox computed
                  from its own two endpoints equals the size that was asked for, so a start address and a
                  size pin the end address exactly.
                type: string
              netboxID:
                description: |-
                  NetBoxID is the allocated object's NetBox primary key. Zero until an allocation is
                  proven server-side: a DryRun endpoint reports what it would have done and writes
                  nothing here.
                format: int64
                type: integer
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation this status refers to. Always set, because
                  `kubectl wait` lies without it.
                format: int64
                type: integer
              pool:
                description: Pool is the pool this claim allocated out of, as resolved
                  at allocation time.
                properties:
                  display:
                    description: 'Display is the pool as a human reads it: a prefix
                      in CIDR notation.'
                    type: string
                  endpoint:
                    description: Endpoint is the pool's NetBox REST path, `ipam/prefixes`.
                    type: string
                  id:
                    description: ID is the pool's NetBox primary key.
                    format: int64
                    type: integer
                type: object
              provenance:
                description: |-
                  Provenance is the stamp the allocated object carries in NetBox: the tag and the
                  custom fields written with the allocating POST, as they were written.
                properties:
                  clusterID:
                    description: ClusterID is the cluster identifier written into
                      the cluster custom field.
                    type: string
                  customFields:
                    additionalProperties:
                      type: string
                    description: |-
                      CustomFields are the custom fields written, as NetBox names to the values sent.
                      Empty for a kind whose NetBox model has no `custom_fields` column.

                      These keys are also the only ones compared: NetBox merges a partial `custom_fields`
                      PATCH and returns every custom field defined for the object type, including ones the
                      operator knows nothing about, so it compares the keys it sets and leaves the rest
                      alone. An absent or empty map therefore still means "manage nothing" rather than
                      "clear everything"; removing one key's value is said with a `null` under
                      spec.customFields (docs/concepts/field-ownership.md, #196).
                    type: object
                  tag:
                    description: |-
                      Tag is the tag's slug, written by id. Empty for a kind whose NetBox model has no
                      `tags` column.
                    type: string
                type: object
              size:
                description: Size is how many addresses the reserved range covers,
                  as NetBox counts them.
                format: int32
                type: integer
              startAddress:
                description: |-
                  StartAddress is the first address of the reserved range, as NetBox stored it.

                  **Immutable, and the one field that must never be lost.** The allocation engine's first
                  guard clause reads it: while it holds a value nothing allocates again, ever. It is
                  written only after a read-after-write that proves the range exists, carries this claim's
                  allocation identity, and starts inside the parent prefix.
                type: string
              url:
                description: URL is the allocated object's absolute NetBox URL, as
                  returned by the API.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
