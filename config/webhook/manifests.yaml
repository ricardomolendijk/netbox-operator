---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-netbox-kubeforge-org
  failurePolicy: Ignore
  matchPolicy: Equivalent
  name: validate.netbox.kubeforge.org
  rules:
  - apiGroups:
    - netbox.kubeforge.org
    apiVersions:
    - '*'
    operations:
    - CREATE
    - UPDATE
    resources:
    - '*'
  sideEffects: None
  timeoutSeconds: 5
