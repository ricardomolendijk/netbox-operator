# The Service the API server calls the validating webhook through.
#
# It selects `control-plane: controller-manager` -- every replica, with no leader-election
# label anywhere near it. A webhook Service that selected only the leader would be served by
# one pod, and with two replicas behind it half the reviews would reach a pod answering 404;
# with failurePolicy: Ignore that is a silent bypass rather than an error. See
# internal/webhook/admission.
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: controller-manager
