apiVersion: v1
kind: Secret
metadata:
  name: netbox-token
  namespace: default
  labels:
    # Required. The operator's Secret cache selects on this label, so a Secret without
    # it is invisible to the operator even when the name is right. See
    # docs/operations/rbac.md.
    netbox.populator.io/endpoint-credential: "true"
type: Opaque
stringData:
  # A NetBox API token with write access to the object types the operator manages.
  # Human accounts should be read-only; see docs/decisions/0005-gitops-coexistence.md.
  token: "0123456789abcdef0123456789abcdef01234567"
---
apiVersion: netbox.populator.io/v1alpha1
kind: NetBoxEndpoint
metadata:
  name: homelab
  namespace: default
spec:
  url: https://netbox.home.arpa
  tokenSecretRef:
    name: netbox-token
    key: token
  mode: Apply
  # Correct is the intended steady state: a NetBox-side edit is drift, and Git wins. Report
  # detects drift and writes nothing at all; Off drops the periodic re-check. See
  # docs/operations/gitops.md.
  driftMode: Correct
  timeout: 30s
  resyncPeriod: 10m
  rateLimit:
    qps: 20
    burst: 40
