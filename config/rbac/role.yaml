---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxendpoints
  - netboxrefgrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxendpoints/status
  - netboxregions/status
  - netboxroutetargets/status
  - netboxsites/status
  - netboxtags/status
  - netboxvrfs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxregions
  - netboxroutetargets
  - netboxsites
  - netboxtags
  - netboxvrfs
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxregions/finalizers
