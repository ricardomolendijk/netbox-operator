---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox.populator.io
  resources:
  - netboxendpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox.populator.io
  resources:
  - netboxendpoints/status
  - netboxtags/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - netbox.populator.io
  resources:
  - netboxtags
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - netbox.populator.io
  resources:
  - netboxtags/finalizers
  verbs:
  - update
