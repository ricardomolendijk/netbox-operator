---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxendpoints
  - netboxrefgrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxendpoints/status
  - netboxlocations/status
  - netboxregions/status
  - netboxsitegroups/status
  - netboxsites/status
  - netboxtags/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxlocations
  - netboxregions
  - netboxsitegroups
  - netboxsites
  - netboxtags
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - netbox.kubeforge.org
  resources:
  - netboxlocations/finalizers
  - netboxregions/finalizers
  - netboxsitegroups/finalizers
  - netboxsites/finalizers
