# The deepest object in the graph: it waits on a VRF, a VLAN whose own identity waits on a
# VLAN group in another namespace, and a Location whose identity waits on a Site.
#
# `scope` here is the second use of the union, through a different member -- since NetBox 4.2
# ipam.Prefix has no `site` column at all and writing one returns 201 and sets nothing.
apiVersion: netbox.kubeforge.org/v1alpha1
kind: NetBoxPrefix
metadata:
  name: acme-net
  namespace: team-a
spec:
  endpointRef: team
  deletionPolicy: Delete
  prefix: 10.117.0.0/24
  status: active
  scope:
    locationRef:
      namespace: netbox-catalog
      name: hall-1
  vrfRef:
    name: acme-vrf
  vlanRef:
    name: vlan-100
