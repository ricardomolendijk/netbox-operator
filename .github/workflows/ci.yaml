name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pinned tool binaries and envtest assets, keyed on the versions in the Makefile
      # so a version bump invalidates the cache instead of silently reusing the old one.
      - name: Cache tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      # This is also where the NBO-060 coverage audit runs: TestCoverage regenerates
      # docs/coverage.md and fails when the committed copy is stale, so a Kind that leaves
      # the registry, a column a field map stops mapping, and a NetBox release that adds a
      # model all arrive as a diff somebody has to commit on purpose. No separate step: the
      # audit reads the registry, so it has to run where the Go tests run.
      - name: Test
        run: make test

      # The highest-value check here. It must run generate AND manifests, and fail on any
      # diff including whitespace, or a stale zz_generated.deepcopy.go ships silently.
      - name: Generated output is committed
        run: make verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  manifests:
    name: kustomize builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # A kustomization that references a file which does not exist is a broken deploy,
      # and it is invisible to go build.
      - name: Build the default overlay
        run: |
          make kustomize
          ./bin/kustomize build config/default > /dev/null
          ./bin/kustomize build config/crd > /dev/null

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, like every tool version in the Makefile. Kept equal to the one
      # .github/workflows/release.yaml installs, so the chart is never first rendered by a
      # different Helm than the one that packages it.
      - name: Install Helm
        env:
          HELM_VERSION: v3.16.3
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 linux-amd64/helm /usr/local/bin/helm

      # lint and template over the defaults and over the all-features values, then diff the
      # golden RBAC render. The last one is the point: config/rbac and the chart both grant
      # Secret access one namespace at a time (#100), and a widening is four lines that a
      # 400-line render would hide.
      - name: Lint, render and diff the chart
        run: make helm-verify

      # The chart's ClusterRole and webhook configuration are copies of config/, generated
      # by hack/helm-sync.sh and covered by `make verify` in the build job. This asserts the
      # two things `make verify` cannot: that the chart packages at all, and that the
      # package is still small enough to install. Helm stores the whole chart in the release
      # Secret and the API server caps that at 1 MiB, which is how bundling the CRDs broke
      # every install (#265) -- so the size is a gate, not a statistic.
      - name: Package the chart
        run: make helm-package

      # The CRD bundle the release publishes, built here so a bundle that stopped generating
      # is a PR failure rather than a release-day one.
      - name: Bundle the CRDs
        run: make crd-bundle

      # No e2e step here. The suite that landed with NBO-017 (#29) brings up a kind cluster
      # and a real NetBox in docker-compose and runs for tens of minutes, which is too slow
      # to sit in front of every PR -- so it lives in e2e.yaml, on a schedule, on a label
      # and on demand. `make vet` in the build job already compiles test/e2e, so the suite
      # cannot rot unnoticed between runs.

  python:
    name: lint the schema extractors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A full regeneration needs a NetBox source checkout, which this job has not got --
      # but linting is cheap and the extractors are the source of docs/netbox-schema.md.
      # src is set explicitly: the action otherwise appends the workspace root to the
      # arguments, so `check hack/` silently became "check hack/ and everything else" --
      # which is how the fixture tree got linted.
      - name: Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check
          src: hack/

      # test_digest.py runs the pipeline over test/fixtures/netbox-models instead, so the
      # extraction defects behind ~112 CRD field lists stay regression-tested without one.
      - name: Test the extraction pipeline
        run: make test-schema
