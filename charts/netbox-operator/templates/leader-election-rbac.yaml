{{- if .Values.leaderElection }}
{{- /*
Namespaced, because the Lease lives beside the manager. A ClusterRole here would let the
operator read every ConfigMap in the cluster to elect a leader in one namespace.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "netbox-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbox-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "netbox-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbox-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "netbox-operator.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "netbox-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
