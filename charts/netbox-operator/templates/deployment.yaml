apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netbox-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbox-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "netbox-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "netbox-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "netbox-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: [/manager]
        args:
        - --health-probe-bind-address=:{{ .Values.health.port }}
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        - --metrics-secure={{ .Values.metrics.secure }}
        {{- end }}
        {{- if include "netbox-operator.webhookEnabled" . }}
        - --webhook-port={{ .Values.webhook.port }}
        {{- else }}
        {{- /*
        Explicit, and the whole of #249. The manager serves the validating webhook by
        default and exits when its serving certificate is not on disk, so a render that
        contains no Certificate and mounts no Secret has to turn the server off -- otherwise
        a default install CrashLoops on
        "open /tmp/k8s-webhook-server/serving-certs/tls.crt: no such file or directory".
        */}}
        - --enable-webhooks=false
        {{- end }}
        {{- with .Values.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        {{- /*
        The namespaces the manager builds Secret informers for. It must match the Roles in
        templates/credential-rbac.yaml, which is why both come from one value: a
        cluster-scoped informer would issue a cluster-scoped LIST and WATCH that no Role
        can authorise, and the manager would never sync. An unset value is fatal at
        startup by design (cmd/manager/main.go), not a silent fallback to cluster-wide.
        */}}
        - name: NETBOX_CREDENTIAL_NAMESPACES
          value: {{ include "netbox-operator.credentialNamespaces" . | quote }}
        {{- with include "netbox-operator.generatedAnnotations" . }}
        {{- /*
        ADR-0005 section 2's annotation set for CRs the operator materialises. Inert until
        something materialises one (NBO-032, #45) -- the chart owns the values and the
        plumbing, the behaviour arrives with that ticket.
        */}}
        - name: NETBOX_GENERATED_ANNOTATIONS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: health
          containerPort: {{ .Values.health.port }}
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        {{- if include "netbox-operator.webhookEnabled" . }}
        {{- /* Named, because the webhook Service's targetPort is the name and not the number. */}}
        - name: webhook
          containerPort: {{ .Values.webhook.port }}
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if include "netbox-operator.webhookEnabled" . }}
        volumeMounts:
        - name: webhook-certs
          {{- /*
          The manager's --webhook-cert-dir default, so the flag stays unset and there is one
          place this path is written rather than two that can disagree. readOnlyRootFilesystem
          does not conflict with it: the mount supplies the path.
          */}}
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
      {{- if include "netbox-operator.webhookEnabled" . }}
      volumes:
      {{- /*
      Issued by templates/webhook-certificate.yaml, and deliberately NOT optional. While
      cert-manager has yet to write it the Pod stays in ContainerCreating, which is a visible
      and self-clearing state. Mounted optionally it would instead start a replica that joins
      the Service and cannot complete a TLS handshake -- and under failurePolicy: Ignore that
      is a silent bypass rather than an error. Same reasoning as config/manager/manager.yaml.
      */}}
      - name: webhook-certs
        secret:
          secretName: {{ include "netbox-operator.webhookCertName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
