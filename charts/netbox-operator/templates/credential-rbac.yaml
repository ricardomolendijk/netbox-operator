{{- /*
The operator's entire Secret grant: one Role and RoleBinding per namespace in
.Values.credentialNamespaces, and nothing cluster-wide.

This is the chart half of #100. The generated ClusterRole (templates/clusterrole.yaml)
carries no `secrets` rule at all, so a namespace that is not listed here is a namespace in
which the operator can read nothing -- and an endpoint there reports
Ready=False/SecretMissing naming the namespace, rather than working by accident.

All three verbs are load-bearing and none is dropped: the informer LISTs then WATCHes, and
`watch` is what makes a rotated token take effect without restarting the manager. `get` is
not issued in normal operation and is kept because it is strictly weaker than `list` and it
is the verb `kubectl auth can-i get secrets -n <ns>` asks about. See
docs/operations/rbac.md.

The namespaces must already exist: a Role cannot be created in a namespace that does not.
*/ -}}
{{- $root := . -}}
{{- range $ns := .Values.credentialNamespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "netbox-operator.fullname" $root }}-endpoint-credential-reader
  namespace: {{ $ns }}
  labels:
    {{- include "netbox-operator.labels" $root | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "netbox-operator.fullname" $root }}-endpoint-credential-reader
  namespace: {{ $ns }}
  labels:
    {{- include "netbox-operator.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "netbox-operator.fullname" $root }}-endpoint-credential-reader
subjects:
- kind: ServiceAccount
  name: {{ include "netbox-operator.serviceAccountName" $root }}
  namespace: {{ $root.Release.Namespace }}
{{- end }}
