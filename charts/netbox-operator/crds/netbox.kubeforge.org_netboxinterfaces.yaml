              wwn:
                description: |-
                  WWN is the interface's World Wide Name, an EUI-64 (docs/netbox-schema.md ->
                  dcim.Interface, `wwn WWNField`).

                  No pattern, deliberately. NetBox's `WWNField` parses the value through netaddr's `EUI`
                  (`netbox/dcim/fields.py` lines 59-71), which accepts several separator conventions, and
                  a pattern narrower than that would reject at admission a value NetBox stores happily --
                  an admission rejection of a correct value being much harder to diagnose than NetBox's
                  own 400, which the operator surfaces as `Reason=Invalid` with the server's message.
                  The bound is the longest spelling: eight hex octets and seven separators.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
