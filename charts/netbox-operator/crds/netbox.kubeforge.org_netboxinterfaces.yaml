              rfChannelFrequency:
                description: |-
                  RFChannelFrequency is the channel's centre frequency in MHz, as a string
                  (docs/netbox-schema.md -> dcim.Interface,
                  `rf_channel_frequency DecimalField decimal(8,3)`).

                  A string for the reason NetBoxDevice.Latitude is one: NetBox returns a DecimalField as
                  a string, and an OpenAPI `number` round-trips through IEEE-754. NetBox derives it from
                  `rfChannel` when that is set, so setting both and disagreeing is NetBox's `clean()` to
                  resolve, not the operator's.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md). Cleared as `null`, which is what the nullable
                  DecimalField takes -- see registry.Field.EmptyIsNull.

                  Five integer digits and three fractional, off `decimal(8,3)`. Unsigned: a frequency is
                  not negative.
                pattern: ^$|^[0-9]{1,5}(\.[0-9]{1,3})?$
                type: string
              rfChannelWidth:
                description: |-
                  RFChannelWidth is the channel's width in MHz, as a string (docs/netbox-schema.md ->
                  dcim.Interface, `rf_channel_width DecimalField decimal(7,3)`). A string, and cleared as
                  `null`, for the reasons RFChannelFrequency gives.

                  Omit it to leave NetBox's own value alone; set it to `""` to clear the value in
                  NetBox. The two are different intents and the operator can tell them apart
                  (docs/concepts/field-ownership.md).

                  Four integer digits, not five: `decimal(7,3)` is seven digits with three after the
                  point.
                pattern: ^$|^[0-9]{1,4}(\.[0-9]{1,3})?$
                type: string
              rfRole:
                description: |-
