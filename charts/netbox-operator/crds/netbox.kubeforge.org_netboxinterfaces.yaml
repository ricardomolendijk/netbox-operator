                  is kilobits: a 400 GbE interface is 400,000,000, which fits an int32, and NetBox's own
                  choice of column width says not to rely on that staying true.
                format: int64
                minimum: 0
                type: integer
              taggedVLANs:
                description: |-
                  TaggedVLANs are the VLANs carried tagged on this interface (docs/netbox-schema.md ->
                  dcim.Interface, `tagged_vlans (BaseInterface) ManyToManyField -> ipam.VLAN`).

                  A to-many reference with the three states every optional field has: omitting the field
                  leaves NetBox's own list alone, `[]` clears it, and a list replaces it. The order is
                  not data -- NetBox does not preserve it -- so the ids are sent sorted and deduplicated
                  and the comparison is order-independent (docs/concepts/drift.md).

                  **All or nothing.** If any element cannot be resolved the whole field is left out of
                  the payload and the object reports `RefsResolved=False` naming the element that failed.
                  Writing the ones that did resolve would be a full-list replacement with a shorter list
                  -- a deletion, reported as a success.

