# A site, end to end: the credential Secret, the endpoint that reads it, and two sites.
#
# Runnable as-is against a real NetBox 4.6.x once the URL and token are yours:
#
#   kubectl apply -f docs/examples/site.yaml
#   kubectl get netboxsite -n netbox-demo
#
# Every kind referenced here exists and its CRD ships in config/crd.
---
apiVersion: v1
kind: Namespace
metadata:
  name: netbox-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: netbox-token
  namespace: netbox-demo
  labels:
    # Required. The operator reads Secrets through a label-scoped informer, so an
    # unlabelled Secret is invisible to it and the endpoint reports SecretMissing even
    # though `kubectl get secret` shows it. See docs/operations/rbac.md.
    netbox.kubeforge.org/endpoint-credential: "true"
type: Opaque
stringData:
  token: "0123456789abcdef0123456789abcdef01234567"
---
apiVersion: netbox.kubeforge.org/v1alpha1
kind: NetBoxEndpoint
metadata:
  name: homelab
  namespace: netbox-demo
spec:
  url: https://netbox.home.arpa
  tokenSecretRef:
    name: netbox-token
  mode: Apply
---
apiVersion: netbox.kubeforge.org/v1alpha1
kind: NetBoxSite
metadata:
  name: home
  namespace: netbox-demo
spec:
  endpointRef: homelab
  name: Home
  slug: home
  status: active
  description: Home lab
  latitude: "51.9244"
  longitude: "4.4777"
  timeZone: Europe/Amsterdam
---
# A second site with no optional fields set. Everything the spec does not mention is left
# exactly as NetBox has it, which is what lets the operator share an object with a human.
apiVersion: netbox.kubeforge.org/v1alpha1
kind: NetBoxSite
metadata:
  name: office
  namespace: netbox-demo
spec:
  endpointRef: homelab
  name: Office
  slug: office
  status: planned
