# Enforces the engineering standards in CONTRIBUTING.md. Every entry below maps to a
# rule stated there; if you are adding a linter, add the rule first.
version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint      # errors compared by value/type, not string
    - makezero
    - nilerr
    - noctx
    - rowserrcheck
    - wrapcheck      # errors crossing a package boundary carry context
    # Control flow: guard clauses, shallow nesting, one job per function
    - nestif         # max nesting depth
    - gocognit
    - cyclop
    - funlen
    - revive         # indent-error-flow, early-return: no else after a guard return
    # No unfinished work in main
    - godox          # TODO / FIXME / XXX fail the build
    # No unstructured logging
    - forbidigo
    # Hygiene
    - misspell
    - prealloc
    - usestdlibvars
    - whitespace

  settings:
    nestif:
      # CONTRIBUTING.md: maximum nesting depth 3.
      min-complexity: 4
    gocognit:
      min-complexity: 30
    cyclop:
      max-complexity: 12
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    godox:
      keywords: [TODO, FIXME, XXX, HACK]
    forbidigo:
      # Structured logging only: logr from the context, never fmt.Print or log.
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "use the logr logger from the context; see CONTRIBUTING.md"
        - pattern: '^println$'
          msg: "use the logr logger from the context; see CONTRIBUTING.md"
        - pattern: '^log\.(Print|Fatal|Panic).*$'
          msg: "use the logr logger from the context; see CONTRIBUTING.md"
        # The engine must never branch on Kind: that behaviour belongs in the
        # Descriptor as data. See CONTRIBUTING.md, "Extensibility".
        - pattern: '^.*switch.*[Kk]ind.*$'
          msg: "no switch on Kind in the reconcile path; put the behaviour in the Descriptor"
          pkg: '^github.com/ricardomolendijk/netbox-operator/internal/(reconciler|resolver)$'
      analyze-types: false
    revive:
      rules:
        - name: indent-error-flow
        - name: early-return
        - name: superfluous-else
        - name: unexported-return
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: exported
          arguments: [checkPrivateReceivers]
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(

  exclusions:
    generated: lax
    rules:
      # Generated deepcopy is not ours to lint.
      - path: zz_generated\..*\.go
        linters: [all]
      # Tests may be long and repetitive; table-driven tests are the point.
      - path: _test\.go$
        linters: [funlen, gocognit, cyclop, dupl, wrapcheck, forbidigo]
      # main() legitimately wires flags and exits.
      - path: cmd/
        linters: [wrapcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ricardomolendijk/netbox-operator
