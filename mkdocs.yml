# Documentation site: docs/ and nothing else.
#
# `docs_dir` is the whole allowlist. MkDocs reads no path outside it, so plan.md,
# roadmap.md, specs/ and any top-level directory added later are invisible to this
# build by default rather than included by default (NBO-086). hack/check-docs-links.py
# asserts that against the built output; do not weaken it to a denylist.
#
# There is deliberately no `nav:`. MkDocs derives navigation from the docs/ tree, so
# navigation cannot drift from what is on disk, and docs/README.md -- the hand-maintained
# index, which becomes the site home page -- stays the single curated reading order.
# A generated nav file would be a second copy of that index and would drift from it.

site_name: NetBox Operator
site_description: A Kubernetes operator that reconciles NetBox objects from custom resources.
site_url: https://netbox.kubeforge.org/
repo_url: https://github.com/ricardomolendijk/netbox-operator
repo_name: ricardomolendijk/netbox-operator
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
site_dir: site

# --strict promotes all of these to errors, which is how CI runs it. A relative link that
# resolves on GitHub but not in the site fails the build instead of shipping a 404.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - toc:
      permalink: true
      # GitHub's heading-slug rules, not Python-Markdown's. The two differ on headings
      # containing an em dash ("0001 -- API group" is `0001--api-group` on GitHub and
      # `0001-api-group` by default), and docs/ already links to GitHub-shaped anchors.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.details

hooks:
  - hack/mkdocs_hooks.py

plugins:
  - search
