# Documentation site: docs/ and nothing else.
#
# `docs_dir` is the whole allowlist. MkDocs reads no path outside it, so plan.md,
# roadmap.md, specs/ and any top-level directory added later are invisible to this
# build by default rather than included by default (NBO-086). hack/check-docs-links.py
# asserts that against the built output; do not weaken it to a denylist.
#
# `nav:` below is hand-written, and it is the site's reading order. It used to be absent, on
# the argument that a derived navigation cannot drift from what is on disk while a second copy
# of docs/README.md's index would. That argument was right about drift and wrong about the
# reader: MkDocs derives navigation alphabetically, so "Coverage" and "Custom fields" came
# before "Getting started", and a first-time user's path was buried in the middle of a list
# sorted by filename (#278).
#
# Two things make the copy safe. `validation.omitted_files: warn` below, plus the `--strict`
# that `make docs-build` passes, turn *any* page under docs/ that this nav does not list into
# a build failure -- so the nav cannot silently fall behind the tree. And the order here is
# the order of docs/README.md's tables, section for section, so the index and the sidebar
# agree by construction; keep them that way when you add a page.

site_name: NetBox Operator
site_description: A Kubernetes operator that reconciles NetBox objects from custom resources.
site_url: https://netbox.kubeforge.org/
repo_url: https://github.com/ricardomolendijk/netbox-operator
repo_name: ricardomolendijk/netbox-operator
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
site_dir: site

