# Per-kind data no reading of NetBox can supply, for hack/gen-types.
#
# Two kinds of entry and nothing else, every key of both tabulated in docs/regenerating.md:
#
#   1. A judgement with no schema behind it -- `shortNames`, the `kubectl get` abbreviation
#      (docs/decisions/0001-*.md), and `printerColumns`, which columns matter to a human. The
#      short-name default is `nb` + the lower-cased model, right for a short model name and
#      unusable for `virtualization.VirtualMachine`.
#   2. A fact neither source states -- `cascades`, whether the server deletes this kind's rows
#      when a union member goes (half the answer is a GenericRelation on the *target* and half
#      an `on_delete=CASCADE` cache column on the referrer, so it cannot be defaulted:
#      internal/registry/scope.go, #214); and the Descriptor policy the engine reads as data --
#      `retainOnDelete`, `duplicateSpec`, `deferred`, `updateStrategy` / `recreateOn`.
#
# Anything else here is a bug in the derivation. An entry that could be read out of the IR
# belongs in hack/build-netbox-ir.py, and a per-kind behaviour belongs in the Descriptor as
# data -- never in a template conditional.
#
# `handWritten: true` keeps a kind out of a full run: it is still ingested and validated, so a
# hand-written kind whose IR has moved is still a failure, it just is not overwritten. Naming
# the kind in `--kinds` emits it anyway, which is how the generator is diffed against a human.

# Initialisms that keep their casing in a Go identifier, matched whole-part and
# case-insensitively: `vrf_id` is `VRFID` and `qinq_svlan` is `QinQSVLAN`. Whole parts only --
# with prefix matching, `ID` in this list turns `idle` into `IDle`.
