# Coverage exclusions -- what the audit is told not to count as a gap.
#
# Read by TestCoverage in internal/registry/coverage_test.go, which joins the schema IR
# (hack/testdata/ir-4.6.8.json.gz) against internal/registry and writes docs/coverage.md.
# Every entry here is checked against the IR: an endpoint that no longer exists, or a
# column that is not a writable column of that model, or an entry the operator has since
# implemented, fails the audit. A stale exclusion is as much a bug as a missing kind.
#
# Nothing is auto-added. A reason is a human's sentence with a citation, because the value
# of this file is the next NetBox minor release: re-extract, run `make coverage`, read the
# diff.
#
# What does NOT belong here:
#   - an absent Kind or column with a ticket that still owes it -- that is a gap, and the
#     audit's job is to report it, not to excuse it;
#   - a reference to a model that simply has no Kind yet -- the audit derives that
#     ("blocked"), so declaring it would be a second copy of a fact it already knows.

# endpoints: NetBox REST endpoints the operator will not implement.
#
# The four groups are plan.md's, section 8. 27 entries against 138 endpoints, which is
# what makes roadmap.md's "~120 CRDs" the checkable number 111.
endpoints:
  # core/* -- read-only records NetBox writes itself, or deferred pending demand.
  - endpoint: core/jobs
    reason: read-only; NetBox writes job records and nothing about one is declarative (plan.md 8)
  - endpoint: core/object-changes
    reason: read-only append-only changelog (plan.md 8)
  - endpoint: core/object-types
    reason: read-only enumeration of NetBox's own content types (plan.md 8)
  - endpoint: core/background-queues
    reason: not a model; an RQ introspection view with no rows to declare (plan.md 8)
  - endpoint: core/background-workers
    reason: not a model; an RQ introspection view with no rows to declare (plan.md 8)
  - endpoint: core/background-tasks
    reason: not a model; an RQ introspection view with no rows to declare (plan.md 8)
  - endpoint: core/data-files
    reason: read-only; a data file is written by a data-source sync (plan.md 8)
  - endpoint: core/data-sources
    reason: deferred pending demand; a remote plus its credentials is deployment configuration (plan.md 8)

  # dcim/* -- one read-only view, and one read-only serializer over a real model.
  - endpoint: dcim/connected-device
    reason: not a model; a read-only lookup view over cable paths (plan.md 8)
  - endpoint: dcim/cable-terminations
    reason: >-
      read-only: CableTerminationSerializer.Meta sets `read_only_fields = fields`
      (netbox/dcim/api/serializers_/cables.py:71), so every one of its twelve fields --
      `cable`, `cable_end`, `termination_type`, `termination_id`, `connector`, `positions`
      included -- is refused on write. NBO-049 asked for a NetBoxCableTermination Kind;
      there is nothing for one to write. A termination is created and destroyed by writing
      dcim.Cable's own `a_terminations` / `b_terminations`, which NetBoxCable does, and
      `connector` / `positions` are unreachable from the REST API in 4.6.8 at all --
      GenericObjectSerializer carries only `{object_type, object_id}`
      (netbox/netbox/api/serializers/generic.py:15)

  # extras/* -- non-declarative, binary, per-user or append-only.
  - endpoint: extras/scripts
    reason: non-declarative; a script is code uploaded and run (plan.md 8)
  - endpoint: extras/scripts/upload
    reason: binary upload, not expressible as a manifest (plan.md 8)
  - endpoint: extras/notifications
    reason: per-user runtime state (plan.md 8)
  - endpoint: extras/notification-groups
    reason: addresses users and groups, which users/* excludes (plan.md 8)
  - endpoint: extras/subscriptions
    reason: per-user runtime state (plan.md 8)
  - endpoint: extras/bookmarks
    reason: per-user UI state (plan.md 8)
  - endpoint: extras/table-configs
    reason: per-user UI state (plan.md 8)
  - endpoint: extras/tagged-objects
    reason: read-only view over the tag through-table; the writable side is each object's own tags (plan.md 8)
  - endpoint: extras/image-attachments
    reason: binary upload, not expressible as a manifest (plan.md 8)
  - endpoint: extras/journal-entries
    reason: append-only; a journal entry is an event, and re-applying a manifest must not rewrite history (plan.md 8)

  # users/* -- identity and authorisation are the cluster's job.
  - endpoint: users/users
    reason: out of scope; identity belongs to the cluster, not to a NetBox manifest (plan.md 8)
  - endpoint: users/groups
    reason: out of scope; identity belongs to the cluster, not to a NetBox manifest (plan.md 8)
  - endpoint: users/tokens
    reason: out of scope; a token in a manifest is a credential in Git (plan.md 8)
  - endpoint: users/permissions
    reason: out of scope; authorisation belongs to the cluster's RBAC (plan.md 8)
  - endpoint: users/owner-groups
    reason: out of scope; the ownership model addresses users, which users/* excludes (plan.md 8)
  - endpoint: users/owners
    reason: out of scope; the ownership model addresses users, which users/* excludes (plan.md 8)
  - endpoint: users/config
    reason: out of scope; per-user UI preferences (plan.md 8)

# columns: writable columns an implemented Kind deliberately does not map.
#
# Only a column whose absence is a *decision* goes here. A column waiting on a ticket, or
# on a Kind that does not exist yet, is a gap: the audit reports it.
columns:
  # `comments` on the organisational kinds. OrganizationalModel declares it and every
  # serializer accepts it, but the M8 field tables name three fields (name, slug,
  # description) and the group kinds that shipped first left it out; the ones that shipped
  # after matched them. Adding it later is additive, a field nobody asked for is not
  # removable -- api/v1alpha1/virtualization_clustertype.go states the decision.
  - kind: dcim.Region
    column: comments
    reason: organisational kinds map name/slug/description only (api/v1alpha1/virtualization_clustertype.go)
  - kind: dcim.SiteGroup
    column: comments
    reason: organisational kinds map name/slug/description only (api/v1alpha1/virtualization_clustertype.go)
  - kind: dcim.Location
    column: comments
    reason: organisational kinds map name/slug/description only (api/v1alpha1/virtualization_clustertype.go)
  - kind: tenancy.TenantGroup
    column: comments
    reason: organisational kinds map name/slug/description only (api/v1alpha1/virtualization_clustertype.go)
  - kind: virtualization.ClusterGroup
    column: comments
    reason: organisational kinds map name/slug/description only (api/v1alpha1/virtualization_clustertype.go)
  - kind: virtualization.ClusterType
    column: comments
    reason: organisational kinds map name/slug/description only (api/v1alpha1/virtualization_clustertype.go)

  # `data_path` on the four `extras` kinds that mix in SyncedDataMixin. NetBox owns the
  # git-sync trio (`data_source`, `data_file`, `data_path`) end to end: it overwrites the
  # synced column -- `data`, `schema`, `template_code` -- from the data source on its own
  # schedule, so a CR declaring both the body and the path it is fetched from would be two
  # writers for one column, with NetBox winning whenever it next syncs. NBO-059's spec puts
  # the trio out of scope for this reason; `data_source` and `data_file` are already blocked
  # because core/* is an excluded app, and `data_path` is the one that needs saying.
  - kind: extras.ConfigContext
    column: data_path
    reason: NetBox owns the git-sync trio and overwrites `data` from it (api/v1alpha1/extras_configcontext.go)
  - kind: extras.ConfigContextProfile
    column: data_path
    reason: NetBox owns the git-sync trio and overwrites `schema` from it (api/v1alpha1/extras_configcontextprofile.go)
  - kind: extras.ConfigTemplate
    column: data_path
    reason: NetBox owns the git-sync trio and overwrites `template_code` from it (api/v1alpha1/extras_configtemplate.go)
  - kind: extras.ExportTemplate
    column: data_path
    reason: NetBox owns the git-sync trio and overwrites `template_code` from it (api/v1alpha1/extras_exporttemplate.go)

# notes: a sentence about a gap, which does not excuse it.
#
# The row stays MISSING and the counts do not move -- a note is there so the next reader
# does not have to re-derive who owes the column, and so "nobody owes it" is written down
# where it can be contradicted. Checked exactly like an exclusion: a note matching no
# MISSING column fails the audit.
notes:
  - kind: "*"
    column: tags
    reason: >-
      writable on every TagsMixin model and no Kind maps it. NBO-073 makes the citation
      possible; no ticket adds the spec field, so this is one systematic gap and not
      eighteen individual ones
  - kind: "*"
    column: tenant
    reason: >-
      deferred to NetBoxTenant (NBO-021), which now ships -- nothing blocks it any more
  - kind: dcim.Site
    column: region
    reason: >-
      deferred with dcim.Site's other optional foreign keys; NetBoxRegion now ships, so
      nothing blocks it any more (api/v1alpha1/dcim_site.go)
  - kind: dcim.Site
    column: group
    reason: >-
      deferred to NetBoxSiteGroup (NBO-066), which now ships -- nothing blocks it any more
  - kind: dcim.Site
    column: asns
    reason: >-
      deferred with dcim.Site's other optional foreign keys; NetBoxASN ships with NBO-055,
      so nothing blocks it any more (api/v1alpha1/dcim_site.go)
  - kind: ipam.FHRPGroup
    column: auth_key
    reason: >-
      a pre-shared key, permitted only as spec.authKeySecretRef (plan.md 15) and the engine
      has no FieldClass that reads a Secret into a payload, so the column is unmapped rather
      than inline; it is in internal/netbox/do.go's redaction set because NetBox returns it
      (api/v1alpha1/ipam_fhrpgroup.go, docs/reference/netboxfhrpgroup.md)
  - kind: dcim.Site
    column: time_zone
    reason: >-
      no ticket and no citation anywhere in the tree: a plain TimeZoneField with no
      dependency on another Kind
  - kind: "*"
    column: local_context_data
    reason: >-
      the ConfigContextModel column on dcim.Device and virtualization.VirtualMachine. NBO-059
      added the ClassJSON field class it needs and stopped at the `extras` app; #241 adds the
      two spec fields, and nothing else blocks them
  - kind: "*"
    column: primary_mac_address
    reason: >-
      NBO-053 owns it. NBO-048 ships the forward half -- a NetBoxMACAddress names the
      interface it is assigned to -- and the reverse half is a deferred field on the two
      BaseInterface component specs, because modelling both directions as required
      references is the unresolvable cycle NBO-016 rejects
      (api/v1alpha1/dcim_macaddress.go)    column: auth_psk
    reason: >-
      deliberately unmapped on both wireless kinds and NOT excused: a pre-shared key may
      never be inline in a spec, so the field has to be `authPSKSecretRef` -> a Secret key,
      which needs a Secret read in the payload path and a Secret informer scoped to the
      object's own namespace. That is shared machinery and an RBAC decision (NBO-072), so
      it owes its own ticket rather than riding along with the kinds
      (api/v1alpha1/wireless_auth.go)
  - kind: dcim.Interface
    column: wireless_lans
    reason: >-
      NBO-053 owns it, with the rest of dcim.Interface's component fields. NBO-050 ships
      wireless.WirelessLAN, so the column is no longer blocked -- only unwritten